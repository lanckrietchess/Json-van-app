    if (!on()) throw Object.assign(new Error('off'), { reason: 'off' });
    const c = cache[p];
    if (c && Date.now() - c.at < 30000) return c.data;
    const data = await post({ action: 'lb_top', period: p, device: deviceId() });
    cache[p] = { at: Date.now(), data };
    return data;
  }
  async function forget() {
    Store.set(SYNC, 0); Store.del(SIG); cache = {};
    if (!on()) return true;
    try { await post({ action: 'lb_forget', device: deviceId() }); return true; } catch (e) { return false; }
  }
  return { on, min, weights, mine, joined, sync, schedule, top, forget, post, endpoint };
})();

/* ---------- training data: what players miss, ask and skip ----------
   Always kept on this device (your own report). Shared with the hub worker
   only after the player says yes, under a random id that is not linked to
   their name, member key or leaderboard entry. */
const Telemetry = (() => {
  const KEY = 'lc-hub-events-v1', SENT = 'lc-hub-events-sent', MAX = 3000, E = /^(s|f|m|st|l|d|q|v|ci|fx|iq)$/;
  let list = null, timer = null, busy = false;
  function all() {
    if (!list) { const raw = Store.get(KEY, []); list = (Array.isArray(raw) ? raw : []).filter((x) => x && E.test(x.e || '') && Number.isFinite(+x.t)).slice(-MAX); }
    return list;
  }
  function clean(ev) {
    const o = { e: ev.e, t: Date.now() };
    ['k', 'g', 'x', 'y', 'c', 'q'].forEach((f) => { if (ev[f] != null && ev[f] !== '') o[f] = String(ev[f]).replace(/[\u0000-\u001f\u007f]/g, ' ').slice(0, f === 'q' ? 200 : 90); });
    if (ev.v != null && Number.isFinite(+ev.v)) o.v = Math.round(+ev.v * 100) / 100;
    return o;
  }
  function log(ev) {
    try {
      if (!ev || !E.test(ev.e || '')) return;
      all().push(clean(ev));
      if (list.length > MAX) list.splice(0, list.length - MAX);
      Store.set(KEY, list);
      if (App.settings.share && Ranks.on()) { clearTimeout(timer); timer = setTimeout(flush, 20000); }
    } catch (e) { /* training data is optional */ }
  }
  function anon() {
    let id = Store.get('lc-hub-anon', '');
    if (!/^a-[a-z0-9]{10,30}$/.test(id || '')) { id = 'a-' + Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => (b % 36).toString(36)).join(''); Store.set('lc-hub-anon', id); }
    return id;
  }
  async function flush(beacon) {
    if (!App.settings.share || !Ranks.on() || busy) return;
    const since = +Store.get(SENT, 0) || 0, batch = all().filter((x) => x.t > since).slice(0, 200);
    if (!batch.length) return;
    const b = bracketOf(App.profile.elo), body = JSON.stringify({ action: 'ev_sync', app: 'lanckrietchess-hub', version: CONFIG.version, anon: anon(), b: b ? b.id : '', events: batch });
    if (beacon === true && navigator.sendBeacon) {
      try { if (navigator.sendBeacon(Ranks.endpoint(), new Blob([body], { type: 'text/plain' }))) Store.set(SENT, batch[batch.length - 1].t); } catch (e) { /* next time */ }
      return;
    }
    busy = true;
    try {
      const res = await fetchWithTimeout(Ranks.endpoint(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }, 8000);
      const d = await res.json();
      if (d && d.ok) Store.set(SENT, batch[batch.length - 1].t);
    } catch (e) { /* next time */ } finally { busy = false; }
  }
  async function forget() {
    const id = Store.get('lc-hub-anon', '');
    Store.del('lc-hub-anon'); Store.set(SENT, 0);
    if (!id || !Ranks.on()) return true;
    try { await Ranks.post({ action: 'ev_forget', anon: id }); return true; } catch (e) { return false; }
  }
  function setShare(yes) {
    App.settings.share = !!yes; App.save();
    if (yes) { Store.set(SENT, Math.max(+Store.get(SENT, 0) || 0, Date.now() - 30 * 864e5)); flush(); } else forget();
  }
  return { log, all, flush, anon, forget, setShare, clear() { list = []; Store.set(KEY, list); } };
})();
function askConsent(force) {
  if (!Ranks.on()) return;
  if (!force && (App.settings.share !== undefined || qs('.sheet-wrap') || Store.get('lc-hub-consent-asked', 0))) return;
  Store.set('lc-hub-consent-asked', Date.now());
  openSheet({
    title: 'Help shape the next lessons', noFocus: true,
    html: '<p>' + esc(CONFIG.coach) + ' builds new lessons and videos from what players actually struggle with. Share anonymous training stats from this hub: which drills you miss, where your games leak and what you ask the coach.</p>' +
      '<p class="small muted">No name, no email, no member key: just a random number for this device. Switch it off in your profile at any time, and what was shared is deleted.</p>' +
      '<div class="btn-row"><button class="btn btn-primary" type="button" data-share="1">Share anonymous stats</button><button class="btn btn-quiet" type="button" data-share="0">No thanks</button></div>',
    onMount(s) {
      s.el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-share]');
        if (!b) return;
        Telemetry.setShare(b.getAttribute('data-share') === '1'); s.close();
        toast(App.settings.share ? 'Thanks. Your stats help shape the next lessons.' : 'Nothing is shared. Your stats stay on this device.', 'good');
      });
    },
    onClose() { if (App.settings.share === undefined) { App.settings.share = false; App.save(); } }
  });
}

/* ---------- celebrations: the brilliant move, perfect runs, streaks, ranks ---------- */
const Celebrate = (() => {
  const COLORS = ['#38bdf8', '#7dd3fc', '#4ade80', '#fbbf24', '#e2e8f0'];
  let last = 0;
  function show(kind, title, text) {
    if (Date.now() - last < 1200) return;
    last = Date.now();
    const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    const el = document.createElement('div');
    el.className = 'cele cele-' + kind;
    el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');
    const glyph = kind === 'brilliant' ? '!!' : kind === 'rank' ? icon('ranking-star') : kind === 'streak' ? icon('fire') : icon('check');
    let bits = '';
    if (!reduce) for (let i = 0; i < 28; i++) bits += '<i style="--a:' + Math.round(i / 28 * 360 + Math.random() * 10) + 'deg;--d:' + Math.round(90 + Math.random() * 120) + 'px;--c:' + COLORS[i % COLORS.length] + ';--s:' + (0.6 + Math.random() * 0.8).toFixed(2) + '"></i>';
    el.innerHTML = '<div class="cele-burst" aria-hidden="true">' + bits + '</div><div class="cele-card"><span class="cele-glyph">' + glyph + '</span><div><strong>' + esc(title) + '</strong>' + (text ? '<span>' + esc(text) + '</span>' : '') + '</div></div>';
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('is-in'));
    const off = () => { el.classList.remove('is-in'); setTimeout(() => el.remove(), 320); };
    el.addEventListener('click', off);
    setTimeout(off, kind === 'brilliant' ? 2700 : 2200);
    if (kind === 'brilliant') Sound.brilliant(); else if (kind !== 'perfect') Sound.fanfare();
    if (!reduce && navigator.vibrate) { try { navigator.vibrate(kind === 'brilliant' ? [25, 40, 70] : 30); } catch (e) { /* optional */ } }
  }
  return {
    brilliant: (text) => show('brilliant', 'Brilliant move!!', text),
    great: (text) => show('perfect', 'Great find', text),
    perfect: (text) => show('perfect', 'Perfect run', text),
    streak: (n) => show('streak', n + ' in a row', 'Right on the first try, every one of them.'),
    rank: (text) => show('rank', 'You’re on the leaderboard', text)
  };
})();

/* ---------- the coach report: a code a student pastes in a Skool DM ---------- */
const CoachReport = (() => {
  const PRE = 'LC-R1-';
  const top = (obj, n, by) => Object.keys(obj).map((k) => obj[k]).sort((a, b) => by(b) - by(a)).slice(0, n);
  function compact(A) {
    return {
      drills: top(A.drills, 15, (d) => d.m * 2 + (d.f ? d.f - d.acc / 100 : 0) + d.s * 0.01).map((d) => [d.k, d.g, d.s, d.f, Math.round(d.acc), d.m]),
      plies: top(A.plies, 10, (p) => p.n).map((p) => [p.k, p.x, p.s, p.n]),
      stages: Object.keys(A.stages).map((k) => A.stages[k]).map((s) => [s.x, s.n, s.fail]),
      leaks: top(A.leaks, 15, (l) => l.n).map((l) => [l.o, l.x, l.p, l.n, l.blunders]),
      diags: Object.keys(A.diags).map((k) => A.diags[k]).map((d) => [d.x, d.y, d.n, d.found]),
      topics: A.topics, questions: A.questions.slice(0, 5).map((q) => [q.q, q.x]), checkins: A.checkins, iq: A.interrogations
    };
  }
  function make() {
    const p = App.profile, b = bracketOf(p.elo), t = App.totals(), wk = Ranks.mine('week');
    const A = lcAggregate(Telemetry.all().filter((x) => x.t > Date.now() - 60 * 864e5));
    const body = { v: 1, d: dayKey(new Date()), n: p.name, e: p.elo, b: b ? b.id : '', l: p.leak, g: p.goal, f: p.focus ? [p.focus.k, p.focus.text, p.focus.since, Focus.onTrack()] : null,
      s: p.struggles, r: p.rep, o: p.openings, tier: App.access.tier, acc: t.accuracy, tries: t.tries, lb: [wk.n, wk.score, Math.round(wk.acc * 100)], a: compact(A) };
    const enc = b64url.enc(JSON.stringify(body));
    return PRE + enc + '-' + fnv(enc);
  }
  function read(tok) {
    tok = String(tok || '').replace(/\s+/g, '');
    const at = tok.toUpperCase().indexOf(PRE);
    if (at < 0) return null;
    const rest = tok.slice(at + PRE.length), cut = rest.lastIndexOf('-');
    if (cut < 1 || fnv(rest.slice(0, cut)) !== rest.slice(cut + 1, cut + 9)) return null;
    try { const d = JSON.parse(b64url.dec(rest.slice(0, cut))); return d && typeof d === 'object' && d.v === 1 && d.a && typeof d.a === 'object' ? d : null; } catch (e) { return null; }
  }
  function expand(r, into) {
    const A = into || lcAggregate([]), b = BRACKET_LABEL[r.b] ? r.b : 'unrated', a = r.a || {}, arr = (x) => (Array.isArray(x) ? x : []);
    const id = 'report:' + String(r.n || '') + ':' + String(r.d || '');
    if (!A.users[id]) { A.users[id] = 1; A.brackets[b] = (A.brackets[b] || 0) + 1; }
    arr(a.drills).forEach((x) => { const key = b + '|' + String(x[0]); const d = A.drills[key] || (A.drills[key] = { b, k: String(x[0]), g: String(x[1] || ''), s: 0, f: 0, acc: 0, m: 0 }); d.s += +x[2] || 0; d.f += +x[3] || 0; d.acc += +x[4] || 0; d.m += +x[5] || 0; });
    arr(a.plies).forEach((x) => { const key = String(x[0]) + '|' + String(x[1]); const p = A.plies[key] || (A.plies[key] = { k: String(x[0]), x: +x[1] || 0, s: String(x[2] || '').slice(0, 12), n: 0 }); p.n += +x[3] || 0; });
    arr(a.stages).forEach((x) => { const key = b + '|' + String(x[0]); const s = A.stages[key] || (A.stages[key] = { b, x: String(x[0]), n: 0, fail: 0 }); s.n += +x[1] || 0; s.fail += +x[2] || 0; });
    arr(a.leaks).forEach((x) => { const key = b + '|' + String(x[0]) + '|' + String(x[1]) + '|' + String(x[2] || ''); const l = A.leaks[key] || (A.leaks[key] = { b, o: String(x[0]), x: String(x[1]), p: String(x[2] || ''), n: 0, blunders: 0 }); l.n += +x[3] || 0; l.blunders += +x[4] || 0; });
    arr(a.diags).forEach((x) => { const key = String(x[0]) + '|' + String(x[1] || ''); const d = A.diags[key] || (A.diags[key] = { x: String(x[0]), y: String(x[1] || ''), n: 0, found: 0 }); d.n += +x[2] || 0; d.found += +x[3] || 0; });
    Object.keys(a.topics && typeof a.topics === 'object' ? a.topics : {}).slice(0, 20).forEach((k) => { A.topics[k] = (A.topics[k] || 0) + (+a.topics[k] || 0); });
    arr(a.questions).forEach((x) => A.questions.push({ q: String(x[0] || '').slice(0, 200), x: String(x[1] || 'other'), b, t: Date.parse(r.d) || 0 }));
    arr(a.checkins).slice(0, 3).forEach((v, i) => { A.checkins[i] += +v || 0; });
    A.interrogations += +a.iq || 0;
    return A;
  }
  function summary(r) {
    const L = [], a = r.a || {}, idx = contentIndex(), arr = (x) => (Array.isArray(x) ? x : []);
    L.push('Training report' + (r.n ? ' for ' + r.n : '') + (r.e ? ' (' + r.e + ', ' + (BRACKET_LABEL[r.b] || 'unrated') + ')' : '') + ', ' + (r.d || ''));
    if (Array.isArray(r.f)) L.push('Hyper-Focus: ' + (FOCUS[r.f[0]] ? FOCUS[r.f[0]][0] : 'own habit') + ': ' + String(r.f[1] || '') + (r.f[3] != null ? ' (' + r.f[3] + '% on track)' : ''));
    if (arr(r.s).length) L.push('Struggles: ' + arr(r.s).map((k) => STRUGGLES[k] || String(k)).join(', '));
    const rep = r.r && typeof r.r === 'object' ? [REP.w[r.r.w], REP.e4[r.r.e4], REP.d4[r.r.d4]].filter(Boolean).join(', ') : '';
    if (rep) L.push('Repertoire: ' + rep);
    L.push('Hub accuracy ' + (+r.acc || 0) + '% over ' + (+r.tries || 0) + ' moves. This week: ' + (Array.isArray(r.lb) ? (+r.lb[0] || 0) + ' puzzles, score ' + (+r.lb[1] || 0) : 'no puzzles') + '.');
    const miss = arr(a.drills).filter((d) => +d[5] > 0).slice(0, 3).map((d) => ((idx[d[0]] || {}).t || String(d[0])) + ' (' + (+d[5] || 0) + ' misses)');
    if (miss.length) L.push('Most missed: ' + miss.join('; '));
    const leak = {};
    arr(a.leaks).forEach((l) => { leak[l[1]] = (leak[l[1]] || 0) + (+l[3] || 0); });
    const lk = Object.keys(leak).sort((x, y) => leak[y] - leak[x]).map((k) => k + ' ' + leak[k]).join(', ');
    if (lk) L.push('Leaks in real games by MSPC step: ' + lk);
    return L.join('\n');
  }
  return { make, read, expand, summary };
})();
const Reports = (() => {
  const KEY = 'lc-admin-reports';

/* ---------- V33: the hooks the existing pages call ---------- */
const V33 = {
  begin(id, meta) { Attempts.begin(id, meta); Telemetry.log({ e: 's', k: id, g: (meta && meta.kind) || '' }); },
  miss(id, kind, ply, san) { Telemetry.log({ e: 'm', k: id, g: kind, x: ply, q: san }); },
  stage(id, k, ok) { Telemetry.log({ e: 'st', k: id, x: k, v: ok ? 1 : 0 }); },
  afterFinish(id, acc, meta, before) {
    const was = Ranks.mine('week'), x = Attempts.log(id, acc, meta);
    Telemetry.log({ e: 'f', k: id, g: (x && x.k) || meta.kind || '', v: Math.round(acc * 100) });
    if (!x) return;
    const now = Ranks.mine('week');
    if (!was.ranked && now.ranked) setTimeout(() => Celebrate.rank('Ranked this week with ' + now.n + ' puzzles. Score ' + now.score + '.'), 600);
    else if (acc === 1 && before < 1 && x.mv >= 3 && /^(think|middlegame|endgame)$/.test(x.k)) setTimeout(() => Celebrate.perfect('Every move right on the first try.'), 450);
    Ranks.schedule();
    if (Attempts.all().length === 3) setTimeout(() => askConsent(), 2400);
  },
  question(q) { Telemetry.log({ e: 'q', q: scrub(q), x: topicOf(q) }); },
  view(route) { Telemetry.log({ e: 'v', k: route }); },
  boot() {
    setTimeout(() => { Ranks.sync(); Telemetry.flush(); }, 3500);

/* ---------- the folder trainer: play the better move, Stockfish judges ---------- */
function FolderTrainer(host, list, opts) {
  opts = opts || {};
  host.innerHTML = '<section class="vt"><div class="back-bar"><button type="button" class="btn btn-quiet btn-sm" data-vt="exit">' + icon('chevron-left') + ' ' + esc(opts.back || 'Back') + '</button><span class="small muted" id="vt-count"></span></div>' + trainerShell('vt-board', 'vt-panel') + '</section>';
  const board = Board(qs('#vt-board', host), {}), panel = qs('#vt-panel', host), timers = [];
  let i = 0, q = null, first = true, busy = false, solved = false, pre = null, token = 0, score = 0;
  const flip = qs('[data-flip="vt-board"]', host);
  if (flip) flip.addEventListener('click', () => board.flip());
  function fb(v, label, text) { const el = qs('[data-part="fb"]', panel); if (el) el.innerHTML = feedbackHTML({ v, label, text }); }
  function paint() {
    qs('#vt-count', host).textContent = 'Position ' + (i + 1) + ' of ' + list.length;
    const task = q.san ? 'In the game you played ' + q.san + (CLS_TAG[q.cls] || '') + ' here. Find a better move.' : 'Find the best move.';
    panel.innerHTML = '<p class="st-kicker">' + esc(q.title) + '</p><h2 class="st-title">' + esc(colorName(sideOf(q.fen))) + ' to play</h2><p class="st-brief">' + esc(task) + '</p>' +
      (q.k ? '<p class="small muted">Leak: ' + esc(q.k + ', ' + MSPC_NAME[q.k]) + (q.phase ? ', ' + esc(q.phase) : '') + '</p>' : '') + '<div data-part="fb" aria-live="polite"></div><div class="st-actions">' +
      (solved ? '<button type="button" class="btn btn-primary btn-sm" data-vt="next">' + (i < list.length - 1 ? 'Next position' : 'See my score') + '</button>'
        : '<button type="button" class="btn btn-ghost btn-sm" data-vt="hint">' + icon('lightbulb') + ' Hint</button><button type="button" class="btn btn-quiet btn-sm" data-vt="show">' + icon('eye') + ' Show the answer</button>') + '</div>';
  }
  function load(n) {
    i = n; q = Object.assign({}, list[n]); first = true; busy = false; solved = false; pre = null; token++;
    const side = sideOf(q.fen);
    board.clearMarks(); board.setArrows([]);
    board.orientation(side === 'w' ? 'white' : 'black');
    board.setPosition(q.fen, { animate: false });
    board.setInteractive(side); board.setOnMove(onMove);
    V33.begin('vault:' + q.key, { moves: 1, kind: 'vault' });
    paint();
  }
  async function best() {
    if (pre) return pre;
    pre = await Engine.analyse(q.fen, { depth: 14, multipv: 2 });
    if (!q.best && pre.best) { q.best = pre.best; q.bestSan = Engine.uciToSan(q.fen, pre.best) || ''; }
    return pre;
  }
  function retry(tok, ms) { timers.push(setTimeout(() => { if (tok !== token || solved) return; board.setArrows([]); board.setPosition(q.fen, {}); board.setInteractive(sideOf(q.fen)); }, ms)); }
  function record(ok) { Vault.record(q, ok); }
  async function onMove(m) {
    if (busy || solved) return;
    const g = new Chess(q.fen), mv = g.move({ from: m.from, to: m.to, promotion: m.promotion || 'q' });
    if (!mv) { board.setPosition(q.fen, {}); return; }
    const uci = mv.from + mv.to + (mv.promotion || ''), tok = token;
    board.setPosition(g.fen(), { lastMove: { from: mv.from, to: mv.to }, sound: mv.captured ? 'capture' : 'move' });
    board.setInteractive(null);
    if (q.san && cleanSan(mv.san) === cleanSan(q.san)) { fb('off', 'That was the game move', 'Look for something better.'); retry(tok, 1000); return; }
    let isBest = !!q.best && uci === q.best, ok = isBest;
    if (!ok) {
      busy = true; fb('info', 'Checking ' + mv.san, 'Stockfish is looking at it…');
      try {
        const p = await best();
        if (tok !== token) return;
        isBest = uci === q.best;
        const pov = sideOf(q.fen) === 'w' ? 1 : -1, t = new Chess(g.fen());
        let cp;
        if (t.in_checkmate()) cp = 10000 * pov; else if (t.game_over()) cp = 0; else { const r = await Engine.analyse(g.fen(), { depth: 12 }); cp = Engine.toCp(r.lines[0]); }
        if (tok !== token) return;
        ok = isBest || Engine.winPct(Engine.toCp(p.lines[0]) * pov) - Engine.winPct(cp * pov) < 7;
      } catch (e) {
        busy = false;
        if (tok !== token) return;
        fb('off', 'Stockfish is not available', 'Tap Show the answer.'); retry(tok, 900); return;
      }
      busy = false;
    }
    if (!ok) {
      Sound.bad(); board.shake();
      if (first) { first = false; record(false); }
      fb('bad', 'Not this one', mv.san + ' lets the advantage go. Try again' + (q.k ? ', and think ' + q.k + ', ' + MSPC_NAME[q.k] + '.' : '.'));
      retry(tok, 1100); return;
    }
    solved = true; Sound.good();
    const wasFirst = first;
    if (first) { score++; record(true); }
    V33.afterFinish('vault:' + q.key, wasFirst ? 1 : 0, { moves: 1, kind: 'vault' }, 0);
    paint();
    fb(isBest ? 'win' : 'alt', isBest ? (wasFirst ? 'Found it' : 'That’s it') : 'Also good', (isBest ? mv.san + ' is Stockfish’s first choice.' : mv.san + ' works too. Stockfish’s first choice was ' + (q.bestSan || 'another move') + '.') + (q.text ? ' ' + q.text : ''));
    if (!isBest && q.best) board.setArrows([{ from: q.best.slice(0, 2), to: q.best.slice(2, 4), kind: 'good' }]);
    if (isBest && wasFirst && isSacrifice(q.fen, uci)) Celebrate.brilliant(mv.san + ' gives material and wins more.');
  }
  async function reveal() {
    const tok = token;
    busy = true;
    try { await best(); } catch (e) { /* no engine: show what we have */ }
    busy = false;
    if (tok !== token || !q.best) { if (tok === token) fb('off', 'No answer stored', 'Stockfish is not available for this position right now.'); return; }
    if (first) { first = false; record(false); }
    solved = true;
    board.setPosition(q.fen, {}); board.setInteractive(null);
    board.setArrows([{ from: q.best.slice(0, 2), to: q.best.slice(2, 4), kind: 'good' }]);
    paint();
    fb('info', 'The move was ' + (q.bestSan || q.best), q.text || 'Play it through in your head once: why does it work?');
  }
  function finish() {
    token++;
    board.setInteractive(null);
    const pctV = Math.round(score / list.length * 100);
    qs('#vt-count', host).textContent = 'Done';
    panel.innerHTML = '<p class="st-kicker">Folder trained</p><h2 class="st-title">' + score + ' of ' + list.length + ' on the first try</h2><p class="st-brief">' + (pctV === 100 ? 'Clean sweep. These mistakes are not costing you points any more.' : pctV >= 60 ? 'Good. The ones you missed come first next time.' : 'These positions are exactly where your rating leaks. Train them again tomorrow: the misses come first.') + '</p>' +
      '<div class="st-actions"><button type="button" class="btn btn-primary btn-sm" data-vt="again">Train again</button><button type="button" class="btn btn-ghost btn-sm" data-vt="exit">' + esc(opts.back || 'Back') + '</button></div>';
    if (list.length >= 3 && pctV === 100) Celebrate.perfect('Every position right on the first try.');
  }
  function onClick(e) {
    const b = e.target.closest('[data-vt]');
    if (!b || !host.contains(b)) return;
    const a = b.getAttribute('data-vt');
    if (a === 'exit') { if (opts.onExit) opts.onExit(); }
    else if (a === 'next') { if (i < list.length - 1) load(i + 1); else finish(); }
    else if (a === 'again') { score = 0; load(0); }
    else if (a === 'show') reveal();
    else if (a === 'hint') {
      if (first) { first = false; record(false); }
      const h = MSPC.filter((x) => x.k === (q.k || 'P'))[0];
      fb('hint', 'Hint: ' + (h ? h.k + ', ' + h.name : 'forcing moves'), h ? h.text : 'Checks, captures and attacks first.');
      if (q.best) board.mark(q.best.slice(0, 2), 'hl-hint');
    }
  }
  host.addEventListener('click', onClick);
  load(0);
  return { destroy() { token++; timers.forEach(clearTimeout); host.removeEventListener('click', onClick); board.destroy(); } };
}

/* ---------- chess helpers for the interrogation and the brilliant-move check ---------- */
const ALL_SQUARES = (() => { const out = []; 'abcdefgh'.split('').forEach((f) => { for (let r = 1; r <= 8; r++) out.push(f + r); }); return out; })();
const PVAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
function sideTo(fen, color) { const p = fen.split(' '); p[1] = color; p[3] = '-'; return p.join(' '); }
/* Pieces of `color` that could capture on `sq` (pseudo-legal), whatever stands there. */
function attackersOf(fen, sq, color) {
  const g = new Chess();
  if (!g.load(sideTo(fen, color))) return [];
  const t = g.get(sq);
  if (!t || t.color === color) { if (t) g.remove(sq); g.put({ type: 'n', color: color === 'w' ? 'b' : 'w' }, sq); }
  return g.moves({ verbose: true, legal: false }).filter((m) => m.to === sq && m.captured).map((m) => ({ from: m.from, piece: m.piece }));
}
function loosePieces(fen, color) {
  const g = new Chess(fen), out = [], opp = color === 'w' ? 'b' : 'w';
  ALL_SQUARES.forEach((sq) => {
    const p = g.get(sq);
    if (!p || p.color !== color || p.type === 'k' || p.type === 'p' || attackersOf(fen, sq, color).length) return;
    out.push({ sq, type: p.type, attacked: attackersOf(fen, sq, opp).length > 0 });
  });
  return out.sort((a, b) => (b.attacked - a.attacked) || (PVAL[b.type] - PVAL[a.type]));
}
function ccaList(fen, color) {
  const g = new Chess(), opp = color === 'w' ? 'b' : 'w', checks = [], captures = [], attacks = [];
  if (!g.load(sideOf(fen) === color ? fen : sideTo(fen, color))) return { checks, captures, attacks };
  const base = g.fen();
  g.moves({ verbose: true }).forEach((m) => {
    if (/[+#]/.test(m.san)) checks.push(m.san);
    if (m.captured) captures.push(m.san);
    if (/[+#]/.test(m.san) || m.captured) return;
    const t = new Chess(base);
    if (!t.move(m.san)) return;
    const after = t.fen(), t2 = new Chess();
    if (!t2.load(sideTo(after, color))) return;
    const hits = t2.moves({ square: m.to, verbose: true, legal: false }).filter((x) => x.captured && x.captured !== 'k' && (PVAL[x.captured] > PVAL[m.piece] || !attackersOf(after, x.to, opp).length));
    if (hits.length) attacks.push(m.san);
  });
  const uniq = (a) => a.filter((x, i) => a.indexOf(x) === i);
  return { checks: uniq(checks), captures: uniq(captures), attacks: uniq(attacks).slice(0, 8) };
}
/* A sacrifice: the moved piece (a minor or more) can be taken by something
   cheaper, or not at all defended, and it doesn't win back as much. */
function isSacrifice(fen, uci) {
  const g = new Chess(fen), mv = g.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] || 'q' });
  if (!mv) return false;
  const val = PVAL[mv.promotion || mv.piece], got = mv.captured ? PVAL[mv.captured] : 0;
  if (val < 3 || val - got < 2) return false;
  const after = g.fen(), opp = mv.color === 'w' ? 'b' : 'w', att = attackersOf(after, mv.to, opp);
  if (!att.length) return false;
  const def = attackersOf(after, mv.to, mv.color).length;
  return !def || Math.min.apply(null, att.map((a) => (a.piece === 'k' ? 100 : PVAL[a.piece]))) < val;
}

/* ---------- the Socratic blunder interrogation (Trim) ----------
   For every mistake of yours the engine stays hidden. M, S and P each get a
   question; you answer (to the AI coach if it is on, or honestly to yourself)
   and then see the facts. At C you play a better move on the board and
   Stockfish judges it live. The verdict says where your thinking broke, and
   that feeds your struggles, your Hyper-Focus and the coach's Insights. */
function TrimInterrogation(T) {
  const A = T.A, view = T.view, board = T.board;
  const STEPS = ['M', 'S', 'P', 'C', 'V'];

      sec('The moves they get wrong', 'The exact move players miss most, per line.', table(['Line', 'Move', 'Misses'], plies.map((p) => '<tr><td>' + esc(p.t) + '</td><td>' + esc(p.s) + ' <span class="dim">(ply ' + (p.x + 1) + ')</span></td><td class="n">' + p.n + '</td></tr>'))) +
      sec('MSPC trainer, step by step', 'How often each step goes wrong in the MSPC positions.', '<div class="ins-bars">' + stages.map((s) => bar(s.x + ', ' + MSPC_NAME[s.x], s.n ? s.fail / s.n : 0, s.n ? pctS(s.fail / s.n) : '–', true)).join('') + '</div>') +
      sec('Leaks in real games', 'From Trim reviews: which MSPC step failed, per opening and phase.', '<div class="ins-bars">' + ['M', 'S', 'P', 'C'].map((x) => bar(x + ', ' + MSPC_NAME[x], byLetter[x] / maxL, String(byLetter[x]), true)).join('') + '</div>' +
        table(['Opening', 'Step', 'Phase', 'Leaks', 'Blunders'], leakRows.map((l) => '<tr><td>' + esc(l.o) + '</td><td>' + esc(l.x) + '</td><td>' + esc(l.p) + '</td><td class="n">' + l.n + '</td><td class="n">' + l.blunders + '</td></tr>'))) +
      sec('Interrogation verdicts', dn ? 'Players agree with Stockfish ' + pctS(agree / dn) + ' of the time and find the better move ' + pctS(dfound / dn) + ' of the time.' : '', table(['Player says', 'Stockfish says', 'Times', 'Better move found'], diags.slice(0, 10).map((d) => '<tr><td>' + esc(d.x === 'time' ? 'The clock' : d.x + ', ' + (MSPC_NAME[d.x] || '')) + '</td><td>' + esc(d.y ? d.y + ', ' + (MSPC_NAME[d.y] || '') : '–') + '</td><td class="n">' + d.n + '</td><td class="n">' + (d.n ? pctS(d.found / d.n) : '–') + '</td></tr>'))) +
      sec('Struggle log', 'What players ask the coach. Emails, links and phone numbers are removed before anything is stored.', '<div class="ins-bars">' + topics.slice(0, 8).map((t) => bar(TOPIC_LABEL[t[0]] || t[0], t[1] / Math.max(1, topics[0][1]), String(t[1]))).join('') + '</div>' +
        (qList.length ? '<ul class="ins-q">' + qList.map((q) => '<li>' + esc(q.q) + '<small>' + esc((TOPIC_LABEL[q.x] || q.x) + ', ' + (BRACKET_LABEL[q.b] || 'Unrated') + (q.t ? ', ' + new Date(q.t).toISOString().slice(0, 10) : '')) + '</small></li>').join('') + '</ul>' : '')) +
      sec('Drop-off', 'Drills players start but don’t finish, and the pages they open.', table(['Drill', 'Started', 'Finished', 'Dropped'], drop.map((d) => '<tr><td>' + esc(d.t) + '</td><td class="n">' + d.s + '</td><td class="n">' + d.f + '</td><td class="n">' + pctS(d.drop) + '</td></tr>'))) +
        '<div class="ins-bars">' + Object.keys(D.views).sort((a, b) => D.views[b] - D.views[a]).slice(0, 10).map((k) => bar(ROUTE_TITLES[k] ? String(ROUTE_TITLES[k]).replace(/^the /, '') : k, D.views[k] / maxV, String(D.views[k]))).join('') + '</div>' +
      (ui.src === 'reports' ? sec('Student reports', 'Students send these from their profile (“Send my training report”). Paste the code to add it.', '<form class="iq-ai" id="ins-rep"><input class="input" name="t" placeholder="Paste an LC-R1- report code" aria-label="Report code"><button class="btn btn-primary btn-sm" type="submit">Add</button></form>' +
        (Reports.list().length ? '<ul class="adm-list">' + Reports.list().map((r) => '<li><div><b>' + esc(r.n || 'No name') + '</b><span class="small muted">' + esc([r.e, BRACKET_LABEL[r.b], r.d].filter(Boolean).join(', ')) + '</span><span class="small">' + esc(Array.isArray(r.f) ? 'Hyper-Focus: ' + String(r.f[1] || '') : 'No Hyper-Focus') + '</span></div><div class="btn-row"><button type="button" class="btn btn-ghost btn-sm" data-ia="read" data-id="' + esc(r.id) + '">Read</button><button type="button" class="icon-btn" data-ia="del" data-id="' + esc(r.id) + '" aria-label="Remove">' + icon('trash') + '</button></div></li>').join('') + '</ul>' : '')) : '') +
      '<div class="btn-row ins-export"><button type="button" class="btn btn-ghost btn-sm" data-ia="csv">' + icon('file-csv') + ' Export CSV</button><button type="button" class="btn btn-quiet btn-sm" data-ia="reload">' + icon('rotate') + ' Refresh</button></div>';
  }
  function onClick(e) {
    const b = e.target.closest('[data-is],[data-ib],[data-ia],[data-copy]');
    if (!b || !view.contains(b)) return;
    if (b.hasAttribute('data-copy')) { copyText(b.getAttribute('data-copy')).then((ok) => toast(ok ? 'Copied.' : 'Copy failed.', ok ? 'good' : 'bad')); return; }
    if (b.hasAttribute('data-is')) { ui.src = b.getAttribute('data-is'); qsa('[data-is]', view).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); load(); return; }
    if (b.hasAttribute('data-ib')) { ui.b = b.getAttribute('data-ib'); qsa('[data-ib]', view).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); paint(); return; }
    const a = b.getAttribute('data-ia');
    if (a === 'reload') load();
    else if (a === 'csv' && D) download('lanckrietchess-insights-' + dayKey(new Date()) + '.csv', insightsCsv(D, contentIndex()), 'text/csv');
    else if (a === 'del') { Reports.remove(b.getAttribute('data-id')); load(); }
    else if (a === 'read') { const r = Reports.list().filter((x) => x.id === b.getAttribute('data-id'))[0]; if (r) openSheet({ title: r.n ? 'Report: ' + r.n : 'Student report', html: '<div class="token-box report-box">' + esc(CoachReport.summary(r)) + '</div>' }); }
  }
  function onSubmit(e) {
    if (e.target.id !== 'ins-rep') return;
    e.preventDefault();
    const r = CoachReport.read(e.target.elements.t.value);
    if (!r) { toast('That is not a valid report code.', 'bad'); return; }
    Reports.add(r); toast('Report added' + (r.n ? ' for ' + r.n : '') + '.', 'good'); load();
  }
  view.addEventListener('click', onClick);
  view.addEventListener('submit', onSubmit);
  load();
  return () => { view.removeEventListener('click', onClick); view.removeEventListener('submit', onSubmit); };
}

/* ---------- the training profile sheet ---------- */
function openTrainingProfile() {
  const p = App.profile, fromGames = Vault.openingsSeen().filter((o) => p.openings.indexOf(o) < 0).slice(0, 6);
  const opts = (map, cur) => '<option value="">Not set</option>' + Object.keys(map).map((k) => '<option value="' + k + '"' + (cur === k ? ' selected' : '') + '>' + esc(map[k]) + '</option>').join('');
  const fk = p.focus ? p.focus.k : '';
  openSheet({
    title: 'Training profile', noFocus: true,
    html: '<form id="tp" class="stack" novalidate>' +
      '<label class="field"><span class="field-label">Username <small>the coach and the leaderboard use it</small></span><input class="input" name="name" maxlength="24" autocomplete="nickname" value="' + esc(p.name) + '"></label>' +
      '<fieldset class="field"><legend class="field-label">Hyper-Focus <small>one habit for the next two weeks</small></legend><div class="choice-grid">' +
        Object.keys(FOCUS).map((k) => choiceHTML('focus', k, FOCUS[k][0], fk === k)).join('') + choiceHTML('focus', 'custom', 'My own habit', fk === 'custom') + choiceHTML('focus', '', 'None for now', !fk) + '</div>' +
        '<input class="input" name="ftext" maxlength="140" placeholder="Write it as the question you ask before every move" value="' + esc(p.focus ? p.focus.text : '') + '"><span class="field-hint">The coach checks in on it and compares it with your Trim reports.</span></fieldset>' +
      '<div class="field"><span class="field-label">Active repertoire</span><div class="tp-selects"><label><span class="small muted">With White</span><select class="input" name="rw">' + opts(REP.w, p.rep.w) + '</select></label>' +
        '<label><span class="small muted">Against 1.e4</span><select class="input" name="re4">' + opts(REP.e4, p.rep.e4) + '</select></label><label><span class="small muted">Against 1.d4</span><select class="input" name="rd4">' + opts(REP.d4, p.rep.d4) + '</select></label></div></div>' +
      '<label class="field"><span class="field-label">Other openings you play <small>comma separated</small></span><input class="input" name="openings" maxlength="300" value="' + esc(p.openings.join(', ')) + '">' +
        (fromGames.length ? '<span class="field-hint">From your games: ' + fromGames.map((o) => '<button type="button" class="linkish" data-add-op="' + esc(o) + '">' + esc(o) + '</button>').join(', ') + '</span>' : '') + '</label>' +
      '<fieldset class="field"><legend class="field-label">Struggles <small>tick all that apply</small></legend><div class="choice-grid">' + Object.keys(STRUGGLES).map((k) => choiceHTML('st', k, STRUGGLES[k], p.struggles.indexOf(k) >= 0, 'checkbox')).join('') + '</div><span class="field-hint">Your interrogation verdicts add to this list by themselves.</span></fieldset>' +
      '<p class="form-msg" aria-live="polite"></p><div class="btn-row"><button class="btn btn-primary" type="submit">Save training profile</button></div></form>',
    onMount(s) {
      const f = qs('#tp', s.el), msg = qs('.form-msg', f), presets = Object.keys(FOCUS).map((k) => FOCUS[k][1]);
      f.addEventListener('change', (e) => {
        if (e.target.name !== 'focus') return;
        const k = e.target.value, t = f.elements.ftext;
        if (FOCUS[k] && (!t.value.trim() || presets.indexOf(t.value.trim()) >= 0)) t.value = FOCUS[k][1];
        else if (k === 'custom' && presets.indexOf(t.value.trim()) >= 0) { t.value = ''; t.focus(); }
      });
      s.el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-add-op]');
        if (!b) return;
        const i = f.elements.openings, cur = i.value.split(',').map((x) => x.trim()).filter(Boolean);
        if (cur.indexOf(b.getAttribute('data-add-op')) < 0) cur.push(b.getAttribute('data-add-op'));
        i.value = cur.join(', '); b.remove();
      });
      f.addEventListener('submit', (e) => {
        e.preventDefault();
        const k = (qs('input[name=focus]:checked', f) || {}).value || '', text = f.elements.ftext.value.replace(/[\u0000-\u001f\u007f<>]/g, ' ').trim().slice(0, 140), prev = App.profile.focus;
        let focus = null;
        if (k) {
          const t = text || (FOCUS[k] ? FOCUS[k][1] : '');
          if (!t) { msg.textContent = 'Write your own habit, or pick one of the four.'; return; }
          focus = prev && prev.k === k && prev.text === t ? prev : { k, text: t, since: dayKey(new Date()) };
        }
        const name = cleanName(f.elements.name.value);
        if (App.settings.board && name !== App.profile.name) Store.del('lc-hub-lb-sig');
        App.profile = sanitizeProfile(Object.assign({}, App.profile, { name, focus, rep: { w: f.elements.rw.value, e4: f.elements.re4.value, d4: f.elements.rd4.value }, openings: f.elements.openings.value.split(','), struggles: qsa('input[name=st]:checked', f).map((x) => x.value) }));
        App.save();
        if (focus && focus !== prev) Telemetry.log({ e: 'fx', x: k });
        if (App.settings.board) Ranks.schedule(500);
        s.close(); refreshChip(); toast('Training profile saved.', 'good'); rerender();
      });
    }
  });
}

/* ==========================================================================
   12. SHELL, ROUTER AND BOOT
   ========================================================================== */
const TABS = [
  { id: 'home', label: 'Home', icon: 'house', routes: ['home'] },
  { id: 'think', label: 'Think', icon: 'brain', routes: ['think', 'shuffle', 'leaderboard'] },
  { id: 'theory', label: 'Theory', icon: 'book-open', routes: ['openings', 'middlegame', 'endgame'], href: '#openings' },
  { id: 'trim', label: 'Trim', icon: 'scissors', routes: ['trim', 'games'] },
  { id: 'upgrades', label: 'Upgrades', icon: 'crown', routes: ['upgrades'] },
  { id: 'about', label: 'About', icon: 'user', routes: ['about'] }
];
const ROUTE_TITLES = { home: 'Home', think: 'the MSPC trainer', shuffle: 'the Shuffle Trainer', openings: 'Openings', middlegame: 'Middlegame', endgame: 'Endgame', trim: 'Trim', upgrades: 'Upgrades', about: 'About', leaderboard: 'the Leaderboard', games: 'the Game Vault', insights: 'Insights' };
const DOC_TITLES = { home: 'Training Hub', think: 'Think: MSPC trainer', shuffle: 'Think: Shuffle Trainer', openings: 'Openings', middlegame: 'Middlegame', endgame: 'Endgame', trim: 'Trim: game review', upgrades: 'Upgrades', about: 'About Kyenzo', leaderboard: 'Think: Leaderboard', games: 'Trim: Game Vault', insights: 'Insights' };
const ALIASES = { arcade: 'shuffle', 'shuffle-trainer': 'shuffle', drill: 'shuffle', analyse: 'trim', analyze: 'trim', analysis: 'trim', review: 'trim', vault: 'upgrades', volt: 'upgrades', upgrade: 'upgrades', theory: 'openings', manual: 'home', mspc: 'think',
  ranking: 'leaderboard', rankings: 'leaderboard', ranks: 'leaderboard', 'game-vault': 'games', gamevault: 'games', 'my-games': 'games', folders: 'games', stats: 'insights' };
const MOUNT = {
  home: mountHome, think: mountThink, shuffle: mountShufflePage,
  openings: (v) => mountTheory(v, 'openings'), middlegame: (v) => mountTheory(v, 'middlegame'), endgame: (v) => mountTheory(v, 'endgame'),
  trim: mountTrim, upgrades: mountUpgrades, about: mountAbout,
  leaderboard: mountLeaderboard, games: mountVault, insights: mountInsights
};
let current = { route: null, dispose: null };
let installPrompt = null;
function routeFromHash() {
  let h = '';
  try { h = decodeURIComponent((location.hash || '').replace(/^#/, '')).toLowerCase(); } catch (e) { h = ''; }
  h = ALIASES[h] || h;
  return MOUNT[h] ? h : 'home';
}
function renderTabs(route) {
  qs('#tabs').innerHTML = TABS.map((t) => '<a class="tab" href="' + (t.href || '#' + t.id) + '"' + (t.routes.indexOf(route) >= 0 ? ' aria-current="page"' : '') + '>' + icon(t.icon) + '<span>' + t.label + '</span></a>').join('');
}
function renderFoot() {
  qs('#foot').innerHTML = '<span>© ' + new Date().getFullYear() + ' Kyenzo Lanckriet, lanckrietchess</span><span style="display:flex;gap:14px;flex-wrap:wrap">' +
    '<a href="' + esc(CONFIG.links.youtube) + '" target="_blank" rel="noopener">YouTube</a><a href="' + esc(CONFIG.links.skool) + '" target="_blank" rel="noopener">Skool</a><a href="#upgrades">Upgrades</a><a href="#about">About</a><span>v' + CONFIG.version + '</span></span>';
}
function render() {
  const route = routeFromHash();
  if (current.dispose) { try { current.dispose(); } catch (e) { console.error(e); } }
  current = { route, dispose: null };
  const view = qs('#view');
  view.className = 'view';
  view.innerHTML = '';
  renderTabs(route);
  try { current.dispose = MOUNT[route](view) || null; }
  catch (e) {
    console.error(e);
    view.innerHTML = '<div class="panel pad"><h1 style="font-size:22px">Something went wrong</h1><p class="muted" style="margin-top:8px">This section failed to load. Reload the page, and if it keeps happening, tell Kyenzo which page it was.</p></div>';
  }
  void view.offsetWidth;
  view.classList.add('is-in');
  document.title = DOC_TITLES[route] + ' – Lanckrietchess Training Hub';
  V33.view(route);
  window.scrollTo(0, 0);
}
function rerender() { render(); }
function boot() {
  const libs = window.jQuery && window.Chess && window.Chessboard && typeof new window.Chess().game_over === 'function';
  if (!libs) { qs('#boot-error').hidden = false; return; }
  Site.init();
  App.load();
  Repertoire.migrate();
  const expired = Access.recheck();
  refreshChip(); renderFoot();
  qs('#profile-chip').addEventListener('click', openProfile);
  document.addEventListener('click', CMS.onClick, true);
  window.addEventListener('hashchange', render);
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; });
  render();
  const lost = (why) => {
    toast(why === 'revoked' ? 'Your member key was switched off. Ask Kyenzo for a new one.'
      : why === 'bound' || why === 'unbound' ? 'Your member key is now active on another device, so this device is back on free access.'
        : 'Your membership key has expired. Grab the new one in the classroom.', 'bad');
    refreshChip(); rerender();
  };
  if (expired) lost(expired);
  Admin.restore().then((ok) => { if (ok) { refreshChip(); rerender(); } }).catch(() => {});
  Site.fetchPublished().then((changed) => {
    const gone = Access.recheck();
    if (gone) { lost(gone); return; }
    refreshChip();
    if (changed && !qs('.sheet-wrap') && ['home', 'about', 'upgrades'].indexOf(routeFromHash()) >= 0) rerender();
  });
  Access.recheckRemote().then((why) => { if (why) lost(why); });
  let linkToken = null;
  try {
    const params = new URLSearchParams(location.search);
    linkToken = params.get(CONFIG.access.param);
    if (linkToken) {
      params.delete(CONFIG.access.param);
      const rest = params.toString();
      history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
      Access.accept(linkToken, 'link').then((r) => { toast(r.message, r.ok ? 'good' : 'bad'); if (r.ok) { refreshChip(); rerender(); } });
    }
  } catch (e) { /* malformed URL: ignore */ }
  let bridgeHits = 0;
  window.addEventListener('message', (e) => {
    if ((CONFIG.access.allowedParentOrigins || []).indexOf(e.origin) < 0) return;
    const d = e.data;
    if (!d || typeof d !== 'object' || d.type !== 'lc-token' || typeof d.token !== 'string' || ++bridgeHits > 5) return;
    Access.accept(d.token, 'embed').then((r) => { if (r.ok) { toast(r.message, 'good'); refreshChip(); rerender(); } });
  });
  if (!App.onboarded) setTimeout(() => { if (!App.onboarded && !qs('.sheet-wrap')) openOnboarding(true); }, linkToken ? 1800 : 900);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && CONFIG.pwa.serviceWorker) navigator.serviceWorker.register(CONFIG.pwa.serviceWorker).catch(() => {});
  V33.boot();
  window.LC = { version: CONFIG.version, hashKey: Access.hashKey, profileToken: Access.encodeProfile, ai: AI.on() };
}
boot();
