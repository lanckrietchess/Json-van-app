<style>
:root{--ink:#0f172a;--ink-2:#0b1222;--surface:#1e293b;--raised:#243349;--rule:#334155;--hair:rgba(148,163,184,.16);--chalk:#e2e8f0;--fog:#94a3b8;--dim:#64748b;--accent:#38bdf8;--accent-ink:#082f49;--accent-soft:rgba(56,189,248,.13);--accent-line:rgba(56,189,248,.45);--good:#4ade80;--good-soft:rgba(74,222,128,.12);--miss:#fb7185;--miss-soft:rgba(251,113,133,.12);--warn:#fbbf24;--warn-soft:rgba(251,191,36,.12);--sq-light:#dde5ee;--sq-dark:#7890aa;--r-lg:18px;--r:12px;--r-sm:9px;--head:98px;--ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--read:'Newsreader',Georgia,'Times New Roman',serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--head) + env(safe-area-inset-top) + 12px)}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--chalk);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
a{color:var(--accent);text-underline-offset:3px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(56,189,248,.35)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
p{margin:0}
ul,ol{margin:0}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:8px;font-weight:700}
.skip:focus{left:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* top bar */
.topbar{position:fixed;inset:0 0 auto 0;z-index:40;background:rgba(15,23,42,.94);-webkit-backdrop-filter:saturate(140%) blur(12px);backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.topbar-inner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand chip" "tabs tabs";align-items:center;padding:0 12px}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;height:48px;color:var(--chalk);text-decoration:none;font-weight:800;letter-spacing:-.02em;font-size:17px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark img{width:24px;height:24px;display:block}
.brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 5px 0 10px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);color:var(--chalk);font-size:13px;font-weight:700}
.profile-chip:hover{border-color:var(--accent-line)}
.chip-streak{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-variant-numeric:tabular-nums}
.chip-streak.is-on{color:var(--warn)}
.chip-tier{color:var(--fog);font-weight:600}
.chip-tier.tier-community{color:var(--accent)}
.chip-tier.tier-vault,.chip-tier.tier-mentor{color:var(--warn)}
.chip-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800}
.tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));height:50px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--fog);text-decoration:none;font-size:11px;font-weight:600;border-radius:10px;min-width:0}
.tab i{font-size:16px}
.tab:hover,.tab[aria-current="page"]{color:var(--chalk)}
.tab[aria-current="page"] i{color:var(--accent)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:26%;right:26%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
@media (max-width:380px){.chip-tier{display:none}.brand-name{font-size:15px}.tab{font-size:10px}}
@media (min-width:900px){:root{--head:64px}.topbar-inner{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand tabs chip";padding:0 24px;height:64px}.tabs{height:64px;max-width:640px;width:100%;margin:0 auto}.tab{flex-direction:row;gap:8px;font-size:14px}.tab i{font-size:14px}}
/* page */
.view{display:block;max-width:1180px;margin:0 auto;padding:calc(var(--head) + env(safe-area-inset-top) + 20px) 16px 72px;outline:none}
.view.is-in{animation:viewIn .2s ease-out both}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
@media (min-width:900px){.view{padding:calc(var(--head) + env(safe-area-inset-top) + 36px) 28px 96px}}
.page-head{margin-bottom:22px;max-width:780px}
.page-head h1{font-size:clamp(28px,6.4vw,44px);line-height:1.04;letter-spacing:-.03em}
.page-head p{margin-top:10px;color:var(--fog);max-width:64ch}
.page-head strong{color:var(--chalk)}
.section{margin-top:48px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.section-head h2{font-size:clamp(20px,4.2vw,26px)}
.section-head p{color:var(--fog);font-size:14.5px;margin-top:5px;max-width:62ch}
.muted{color:var(--fog)}.dim{color:var(--dim)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg)}
.pad{padding:18px}
@media (min-width:640px){.pad{padding:22px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:var(--r);border:1px solid transparent;font-weight:700;font-size:15px;text-decoration:none;line-height:1.1;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .08s;background:transparent;color:var(--chalk)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:#7dd3fc}
.btn-ghost{border-color:var(--rule)}
.btn-ghost:hover{border-color:var(--accent-line)}
.btn-quiet{color:var(--fog);padding:0 10px}
.btn-quiet:hover{color:var(--chalk)}
.btn-gold{background:var(--warn);color:#291a00}
.btn-gold:hover{background:#fcd34d}
.btn-sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:var(--r-sm)}
.btn-block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:transparent;color:var(--fog)}
.icon-btn:hover{color:var(--chalk);border-color:var(--accent-line)}
.icon-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.icon-btn[disabled]{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--ink-2);border:1px solid var(--hair);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg a,.seg button{flex:none;border:0;background:transparent;color:var(--fog);font-weight:700;font-size:14px;padding:8px 14px;border-radius:9px;text-decoration:none;white-space:nowrap}
.seg [aria-current="page"],.seg [aria-pressed="true"]{background:var(--surface);color:var(--chalk)}
.subnav{margin-bottom:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--fog);font-weight:600;font-size:14px;white-space:nowrap}
.chip:hover{color:var(--chalk)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--chalk)}
.chip .fa-lock{color:var(--accent)}.chip .fa-crown{color:var(--warn)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px}
.metric{background:var(--surface);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:center}
.metric-icon{grid-row:span 2;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--ink-2);color:var(--fog);font-size:13px}
.metric[data-metric="streak"] .metric-icon{color:var(--warn)}
.metric-value{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;display:inline-block}
.metric-label{font-size:12px;color:var(--fog);line-height:1.2}
@media (max-width:440px){.metric{grid-template-columns:1fr;padding:10px 12px}.metric-icon{display:none}.metric-value{font-size:18px}}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.3);color:var(--warn)}100%{transform:scale(1)}}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.lock-community{color:var(--accent);background:var(--accent-soft)}
.lock-vault{color:var(--warn);background:var(--warn-soft)}
.rows{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-top:1px solid var(--hair);background:transparent;text-align:left;width:100%;color:var(--chalk);text-decoration:none;font-size:15px}
.row:first-child{border-top:0}
.row:hover{background:var(--raised)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:700;display:block}
.row-sub{display:block;color:var(--fog);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{display:flex;align-items:center;gap:10px;flex:none;color:var(--fog);font-size:13px}
.row.is-locked .row-title{color:var(--fog)}
.side-dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid #64748b;flex:none}
.side-dot.w{background:#e2e8f0}.side-dot.b{background:#0b1222}
.progress-pill{font-variant-numeric:tabular-nums;font-weight:700;color:var(--good)}
/* trainer + board */
.trainer{display:grid;gap:16px;align-items:start}
@media (min-width:960px){.trainer{grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px}}
.trainer-panel{padding:18px;min-width:0}
.board-col{min-width:0}
.board-shell{display:flex;gap:8px;align-items:stretch;justify-content:center;width:100%;max-width:580px;margin:0 auto}
.board-host{flex:1;min-width:0;width:100%;max-width:560px;margin:0 auto;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.board-tools{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.board-sm{max-width:360px}.board-xs{max-width:250px}
.lc-board{position:relative}
.lc-board .board-b72b1{border:0;border-radius:8px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(2,6,23,.85),0 0 0 1px rgba(148,163,184,.12)}
.lc-board .white-1e1d7{background:var(--sq-light);color:var(--sq-dark)}
.lc-board .black-3c85d{background:var(--sq-dark);color:var(--sq-light)}
.lc-board .notation-322f9{font-family:var(--ui);font-size:10px;font-weight:700}
.lc-board .white-1e1d7 .notation-322f9{color:var(--sq-dark)}.lc-board .black-3c85d .notation-322f9{color:var(--sq-light)}
.lc-board .alpha-d2270{bottom:1px;right:3px}.lc-board .numeric-fc462{top:1px;left:2px}
.lc-board .square-55d63{position:relative}
.lc-board .hl-last{box-shadow:inset 0 0 0 200px rgba(56,189,248,.30)}
.lc-board .hl-sel{box-shadow:inset 0 0 0 200px rgba(56,189,248,.52)}
.lc-board .hl-hint{box-shadow:inset 0 0 0 200px rgba(251,191,36,.55)}
.lc-board .hl-good{box-shadow:inset 0 0 0 200px rgba(74,222,128,.55)}
.lc-board .hl-bad{box-shadow:inset 0 0 0 200px rgba(251,113,133,.62)}
.lc-board .hl-key{box-shadow:inset 0 0 0 3px rgba(56,189,248,.95),inset 0 0 0 200px rgba(56,189,248,.18)}
.lc-board .hl-check{background-image:radial-gradient(circle,rgba(251,113,133,.95) 0%,rgba(251,113,133,.55) 38%,rgba(251,113,133,0) 72%)}
.lc-board .hl-dot::after{content:"";position:absolute;left:50%;top:50%;width:26%;height:26%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(15,23,42,.38);pointer-events:none}
.lc-board .hl-cap::after{content:"";position:absolute;inset:5%;border-radius:50%;border:5px solid rgba(15,23,42,.38);pointer-events:none}
.lc-board.is-tap .square-55d63{cursor:pointer}
.lc-arrows{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.arrow{stroke-linecap:round;opacity:.88}
.arrow-pv1{stroke:#38bdf8}.ah-pv1{fill:#38bdf8}.arrow-pv2{stroke:#4ade80}.ah-pv2{fill:#4ade80}.arrow-pv3{stroke:#fbbf24}.ah-pv3{fill:#fbbf24}.arrow-pv4{stroke:#a78bfa}.ah-pv4{fill:#a78bfa}.arrow-pv5{stroke:#94a3b8}.ah-pv5{fill:#94a3b8}
.arrow-best{stroke:#38bdf8}.ah-best{fill:#38bdf8}.arrow-good{stroke:#4ade80}.ah-good{fill:#4ade80}.arrow-bad{stroke:#fb7185}.ah-bad{fill:#fb7185}.arrow-plan{stroke:#fbbf24}.ah-plan{fill:#fbbf24}
.lc-promo{position:absolute;inset:0;display:grid;place-items:center;background:rgba(15,23,42,.6);z-index:5;border-radius:8px}
.lc-promo[hidden]{display:none}
.lc-promo-box{display:flex;gap:6px;padding:8px;background:var(--surface);border:1px solid var(--rule);border-radius:14px}
.lc-promo-box button{width:56px;height:56px;border-radius:10px;border:1px solid var(--rule);background:var(--sq-light);padding:4px}
.lc-promo-box img{width:100%;height:100%;display:block}
.shake{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.evalbar{position:relative;flex:none;width:20px;border-radius:7px;background:#0b1222;border:1px solid var(--rule);overflow:hidden}
.evalnum{position:absolute;left:0;right:0;z-index:1;font-size:9px;font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;pointer-events:none}
.evalnum.at-bottom{bottom:5px}.evalnum.at-top{top:5px}.evalnum.on-w{color:#0f172a}.evalnum.on-b{color:#e2e8f0}
.evalbar[hidden]{display:none}
.evalfill{position:absolute;left:0;right:0;bottom:0;height:50%;background:#e2e8f0;transition:height .4s ease}
.evalbar.is-flipped .evalfill{bottom:auto;top:0}
/* feedback, stages */
.fb{border:1px solid var(--hair);border-left:3px solid var(--fog);background:var(--ink-2);border-radius:12px;padding:12px 14px;animation:fbIn .22s ease-out}
@keyframes fbIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.fb-head{display:flex;align-items:center;gap:8px;font-weight:800}
.fb-san{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--fog);font-weight:700}
.fb p{margin-top:6px;color:#cbd5e1;font-size:15px}
.fb-good,.fb-alt{border-left-color:var(--good)}.fb-good i,.fb-alt i{color:var(--good)}
.fb-win{border-left-color:var(--good);background:var(--good-soft)}.fb-win i{color:var(--good)}
.fb-bad,.fb-miss{border-left-color:var(--miss)}.fb-bad i,.fb-miss i{color:var(--miss)}
.fb-off,.fb-hint{border-left-color:var(--warn)}.fb-off i,.fb-hint i{color:var(--warn)}
.fb-info{border-left-color:var(--accent)}.fb-info i{color:var(--accent)}
.fb-done{border-left-color:var(--accent);background:var(--accent-soft)}.fb-done i{color:var(--accent)}
.mspc-steps{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mspc-steps li{border:1px solid var(--hair);border-radius:12px;padding:8px 4px;text-align:center;background:var(--ink-2);color:var(--dim)}
.mspc-steps b{display:block;font-size:22px;font-weight:800;line-height:1}
.mspc-steps small{display:block;font-size:11px;font-weight:600;margin-top:4px}
.mspc-steps .is-now{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.mspc-steps .is-ok{color:var(--good);border-color:rgba(74,222,128,.35)}
.mspc-steps .is-miss{color:var(--miss);border-color:rgba(251,113,133,.35)}
.st-title{font-size:21px}
.st-kicker{color:var(--accent);font-size:13px;font-weight:700;margin-bottom:4px}
.st-brief{color:var(--fog);margin-top:8px}
.st-stage{margin-top:16px}
.st-prompt{font-weight:700;font-size:16.5px;line-height:1.4}
.st-prompt .k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800;margin-right:8px;vertical-align:1px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:transparent;color:var(--chalk);font-size:15px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent-line);background:var(--accent-soft)}
.opt.is-right{border-color:var(--good);background:var(--good-soft)}
.opt.is-wrong{border-color:rgba(251,113,133,.6);background:var(--miss-soft);color:#fecdd3}
.opt[disabled]{cursor:default}
.st-feedback{margin-top:12px}.st-feedback:empty{display:none}
.st-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.st-debrief{margin-top:18px;border-top:1px solid var(--hair);padding-top:16px}
.st-debrief[hidden]{display:none}
.debrief-title{font-size:17px;display:flex;align-items:center;gap:8px}
.debrief-title i{color:var(--accent)}
.debrief{display:grid;gap:10px;margin-top:12px}
.debrief>div{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.debrief b{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800}
.debrief p{color:#cbd5e1;font-size:15px}
.tap-hint{margin-top:10px;color:var(--fog);font-size:14px;display:flex;gap:8px;align-items:center}
.turn{margin-top:12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
.wait-dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.moves{display:flex;flex-wrap:wrap;gap:3px 4px;font-variant-numeric:tabular-nums;font-size:14.5px;line-height:1.6;margin-top:12px}
.mv{border:0;background:transparent;color:var(--chalk);padding:1px 6px;border-radius:6px;font-weight:600;font-size:14.5px}
button.mv:hover{background:var(--raised)}
.mv.is-now{background:var(--accent);color:var(--accent-ink)}
.mv.is-miss{color:var(--miss)}.mv.is-dim{color:var(--dim)}
.mv-n{color:var(--dim);font-weight:600;padding:1px 0 1px 4px}
.tag-blunder{color:var(--miss)}.tag-mistake{color:#fb923c}.tag-inaccuracy{color:var(--warn)}.tag-best{color:var(--good)}
.mv .t{font-weight:800;margin-left:1px}
.mv.is-now .t{color:inherit}
/* sheet + toast */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(2,6,23,.68);opacity:0;transition:opacity .18s}
.sheet{position:relative;width:100%;max-width:560px;max-height:min(90vh,880px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--rule);border-radius:20px 20px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(24px);opacity:0;transition:transform .2s ease-out,opacity .2s}
.sheet-wrap.is-open .sheet{transform:none;opacity:1}
.sheet-wrap.is-open .sheet-backdrop{opacity:1}
.sheet-wrap.is-closing .sheet{transform:translateY(24px);opacity:0}
.sheet-wrap.is-closing .sheet-backdrop{opacity:0}
.sheet-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px;background:var(--surface);z-index:2}
.sheet-head h2{font-size:19px}
.sheet-body{display:grid;gap:16px}
.sheet-body h3{font-size:15px}
@media (min-width:700px){.sheet-wrap{align-items:center;padding:20px}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;z-index:90;background:#0b1222;border:1px solid var(--rule);color:var(--chalk);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(2,6,23,.55);transition:transform .2s,opacity .2s;max-width:calc(100vw - 32px);width:max-content}
.toast.is-in{transform:translate(-50%,0);opacity:1}
.toast-good{border-color:rgba(74,222,128,.55)}.toast-bad{border-color:rgba(251,113,133,.55)}
/* forms */
.input{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);background:var(--ink-2);color:var(--chalk);font-size:16px}
.input:focus{outline:none;border-color:var(--accent)}
textarea.input{resize:vertical;min-height:120px;line-height:1.45;font-size:14px}
.field{display:grid;gap:8px;border:0;padding:0;margin:0;min-width:0}
.field-label{font-weight:700;font-size:14px;padding:0}
.field-label small{color:var(--dim);font-weight:600;margin-left:6px}
.field-hint{color:var(--dim);font-size:13px}
.choice-grid{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:inline-flex;align-items:center;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--rule);color:var(--fog);font-size:14px;font-weight:600;cursor:pointer}
.choice input:checked+span{border-color:var(--accent-line);background:var(--accent-soft);color:var(--chalk)}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.token-row{display:flex;gap:8px}
.token-row .input{letter-spacing:.02em;min-width:0}
.form-msg{min-height:20px;font-size:14px;color:var(--fog);margin-top:8px}
.form-msg.is-good{color:var(--good)}.form-msg.is-bad{color:var(--miss)}
.token-box{background:var(--ink-2);border:1px dashed var(--rule);border-radius:12px;padding:12px;font-size:12.5px;word-break:break-all;color:#cbd5e1;max-height:110px;overflow:auto}
.divider{height:1px;background:var(--hair)}
.stack{display:grid;gap:10px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
/* home */
.hero{display:grid;gap:30px;align-items:center;padding-top:4px}
@media (min-width:960px){.hero{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:52px}}
.hero h1{font-size:clamp(38px,9.4vw,66px);line-height:.98;letter-spacing:-.038em;max-width:12.5ch}
.hero .lede{font-family:var(--read);font-size:clamp(18px,2.6vw,21px);line-height:1.52;color:#cbd5e1;margin-top:18px;max-width:52ch}
.hero .btn-row{margin-top:24px}
.hero-fig{margin:0;justify-self:center;width:100%;max-width:380px}
.hero-cap{margin-top:12px;min-height:50px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.hero-cap .k{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px}
.hero-cap.is-bad{color:#fecdd3}
.hero-actions{justify-content:center;margin-top:4px}
@media (min-width:960px){.hero-fig{max-width:460px}.hero-fig .board-sm{max-width:460px}}
.method{display:grid;gap:12px}
@media (min-width:820px){.method{grid-template-columns:repeat(3,minmax(0,1fr))}}
.method-card{padding:20px;display:flex;flex-direction:column;gap:10px}
.method-card h3{font-size:26px;letter-spacing:-.03em}
.method-card p{color:var(--fog)}
.method-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.leaks{border-top:1px solid var(--hair)}
.leak{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 2px;border-bottom:1px solid var(--hair);color:var(--chalk);text-decoration:none}
.leak-q{font-family:var(--read);font-size:clamp(17px,2.4vw,20px);line-height:1.35}
.leak-go{display:flex;align-items:center;gap:8px;color:var(--fog);font-weight:700;font-size:14px;white-space:nowrap}
.leak:hover .leak-go{color:var(--accent)}
.founder{display:grid;gap:16px;padding:22px;align-items:center}
@media (min-width:820px){.founder{grid-template-columns:auto minmax(0,1fr) auto;gap:28px}}
.founder-num{font-size:clamp(34px,7vw,46px);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.founder-num span{color:var(--accent)}
/* think + theory */
.pillars{display:grid;gap:10px}
@media (min-width:760px){.pillars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1080px){.pillars{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pillar{padding:18px}
.pillar-letter{font-size:42px;font-weight:800;color:var(--accent);line-height:1;letter-spacing:-.04em}
.pillar h3{font-size:18px;margin-top:8px}
.pillar p{color:var(--fog);font-size:14.5px;margin-top:8px}
.upsell{display:grid;gap:14px;align-items:center}
@media (min-width:760px){.upsell{grid-template-columns:minmax(0,1fr) auto}}
.upsell h3{font-size:19px}.upsell p{color:var(--fog);margin-top:6px}
.cards{display:grid;gap:12px}
@media (min-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1080px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:8px;padding:18px;text-align:left;color:var(--chalk);border:1px solid var(--hair);background:var(--surface);border-radius:var(--r-lg);text-decoration:none;width:100%;font-size:15px}
.card:hover{border-color:var(--accent-line)}
.card h3{font-size:18px}
.card p{color:var(--fog);font-size:14.5px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px;font-size:13px;color:var(--fog)}
.back-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-width:0}
.back-bar p{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fog);font-size:14px}
.back-bar strong{color:var(--chalk)}
.study{display:grid;gap:14px}
.study h4{font-size:13.5px;color:var(--fog);font-weight:700;letter-spacing:0;margin-bottom:6px}
.study ol{padding-left:20px;display:grid;gap:6px;color:#cbd5e1}
.sq-chips{display:flex;gap:6px;flex-wrap:wrap}
.sq{font-weight:800;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);border:0;font-size:14px}
.mistake{border-left:3px solid var(--miss);padding:4px 0 4px 12px;color:#cbd5e1}
.cands{display:grid;gap:6px;margin-top:8px}
.cand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);background:transparent;color:var(--chalk);text-align:left;width:100%;font-size:14px}
.cand:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.cand b{font-size:15px;font-variant-numeric:tabular-nums}
.cand span{color:var(--fog);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path{display:flex;flex-wrap:wrap;gap:2px 4px;font-variant-numeric:tabular-nums;font-size:14px;margin-top:8px}
.eng{margin-top:14px;padding:12px;border-radius:12px;background:var(--ink-2);border:1px solid var(--hair);font-size:14px;display:grid;gap:6px}
.eng-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eng-eval{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.eng-pv{color:#cbd5e1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lesson-head{margin-bottom:16px}.lesson-head h2{font-size:clamp(22px,4.6vw,30px)}.lesson-head p{margin-top:6px;color:var(--fog);max-width:70ch}
.steps-dots{display:flex;gap:6px;margin-top:10px}
.steps-dots span{height:5px;flex:1;max-width:44px;border-radius:3px;background:var(--rule)}
.steps-dots .is-done{background:var(--good)}.steps-dots .is-now{background:var(--accent)}
.rep-actions{display:flex;gap:6px;flex-wrap:wrap}
/* analyse + coach */
.an-grid{display:grid;gap:18px;align-items:start}
@media (min-width:1040px){.an-grid{grid-template-columns:minmax(0,1fr) 390px}}
.import summary{cursor:pointer;font-weight:800;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px}
.import summary::-webkit-details-marker{display:none}
.import[open] summary{border-bottom:1px solid var(--hair)}
.import-body{padding:16px 18px;display:grid;gap:10px}
.nav-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.game-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:14px 0 10px;font-size:14px;color:var(--fog)}
.game-meta strong{color:var(--chalk)}
.variation{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.review-bar{height:6px;border-radius:3px;background:var(--ink-2);overflow:hidden;margin-top:10px}
.review-bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.coach{padding:16px;display:grid;gap:12px;min-width:0}
@media (min-width:1040px){.coach{position:sticky;top:calc(var(--head) + 20px)}}
.coach-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.coach-head h2{font-size:18px}
.coach-mini{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:center}
.coach-mini p{font-size:13.5px;color:var(--fog)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:380px;min-height:120px;overflow-y:auto;padding-right:2px}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.msg-bot{background:var(--ink-2);border:1px solid var(--hair);border-top-left-radius:6px;align-self:flex-start}
.msg-me{background:var(--accent);color:var(--accent-ink);border-top-right-radius:6px;align-self:flex-end;font-weight:600}
.msg-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--fog);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-form{display:flex;gap:8px}
.report{padding:18px;margin-top:16px;display:grid;gap:18px}
.report h3{font-size:16px}
.report-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rs{background:var(--ink-2);border-radius:12px;padding:10px 6px;text-align:center}
.rs b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.rs span{font-size:12px;color:var(--fog)}
.bars{display:grid;gap:8px;margin-top:8px}
.bar{display:grid;grid-template-columns:118px minmax(0,1fr) 26px;gap:10px;align-items:center;font-size:14px}
.bar-track{height:10px;border-radius:5px;background:var(--ink-2);overflow:hidden}
.bar-fill{height:100%;border-radius:5px;background:var(--accent);min-width:2px}
.bar-n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.top-leak{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:14px;padding:14px;display:grid;gap:8px}
.moments{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.moment{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px;border-radius:12px;background:var(--ink-2)}
.moment-k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:var(--accent-soft);color:var(--accent)}
.moment p{font-size:14px;color:#cbd5e1;margin-top:2px}
.locked-wrap{position:relative}
.locked-wrap .moments{filter:blur(4px);pointer-events:none;user-select:none;opacity:.6}
.locked-over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.locked-over>div{display:grid;gap:10px;justify-items:center;max-width:340px}
/* vault */
.vault-hero h1{font-size:clamp(34px,8.4vw,60px);line-height:.98;letter-spacing:-.038em;max-width:14ch}
.vault-hero p{font-family:var(--read);font-size:clamp(18px,2.4vw,21px);color:#cbd5e1;margin-top:16px;max-width:58ch;line-height:1.52}
.pillars3{display:grid;gap:12px}
@media (min-width:860px){.pillars3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pillars3 .panel{padding:20px}
.pillars3 h3{font-size:19px;margin-top:6px}
.pillars3 p{color:var(--fog);margin-top:8px;font-size:15px}
.pillars3 .k{color:var(--accent);font-weight:800;font-size:14px}
.tiers{display:grid;gap:12px}
@media (min-width:900px){.tiers{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tier{padding:22px;display:flex;flex-direction:column;gap:12px}
.tier-name{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13.5px;color:var(--fog)}
.tier-name i{font-size:16px;color:var(--accent)}
.tier h3{font-size:22px}
.tier-price{font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.tier-price small{font-size:15px;color:var(--fog);font-weight:600;letter-spacing:0}
.tier ul{list-style:none;padding:0;display:grid;gap:8px;font-size:14.5px;color:#cbd5e1}
.tier li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}
.tier li i{color:var(--good);margin-top:5px;font-size:12px}
.tier .btn{margin-top:auto}
.tier-car{border-color:var(--accent-line);background:linear-gradient(180deg,rgba(56,189,248,.09),rgba(56,189,248,0) 45%),var(--surface)}
.tier-jet{border-color:rgba(251,191,36,.38)}
.tier-jet .tier-name i{color:var(--warn)}
.bot{padding:16px;display:grid;gap:12px}
.bot .chat{max-height:480px;min-height:240px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{border:1px solid var(--accent-line);background:transparent;color:var(--chalk);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.quick button:hover{background:var(--accent-soft)}
.rec{border:1px solid var(--accent-line);border-radius:14px;padding:14px;background:var(--accent-soft);display:grid;gap:10px;align-self:stretch;max-width:100%}
.rec h4{font-size:16px}
/* about */
.about-hero h1{font-size:clamp(46px,12vw,92px);line-height:.94;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.about-hero h1 span{color:var(--accent)}
.about-hero p{color:var(--fog);margin-top:14px;max-width:62ch}
.chart{padding:14px 10px 6px;margin-top:22px}
.chart svg{display:block;width:100%;height:auto}
.story{font-family:var(--read);font-size:clamp(18px,2.3vw,20.5px);line-height:1.64;color:#dbe3ec;max-width:66ch;margin:40px auto 0;display:grid;gap:18px}
.story .big{font-size:clamp(23px,3.6vw,30px);line-height:1.32;color:var(--chalk)}
.proof{display:grid;gap:16px;padding:22px}
@media (min-width:760px){.proof{grid-template-columns:repeat(3,minmax(0,1fr))}}
.proof-n{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.proof p{color:var(--fog);font-size:14.5px;margin-top:6px}
.quote{font-family:var(--read);font-size:clamp(21px,3vw,27px);line-height:1.4;max-width:42ch;border-left:3px solid var(--accent);padding-left:18px;margin:0}
.links{display:grid;gap:8px}
@media (min-width:700px){.links{grid-template-columns:repeat(3,minmax(0,1fr))}}
.link-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--hair);background:var(--surface);color:var(--chalk);text-decoration:none;font-weight:700}
.link-card i{font-size:18px;color:var(--fog);width:22px;text-align:center}
.link-card small{display:block;color:var(--fog);font-weight:600;font-size:12.5px}
.link-card:hover{border-color:var(--accent-line)}
.foot{max-width:1180px;margin:0 auto;padding:26px 16px calc(28px + env(safe-area-inset-bottom));border-top:1px solid var(--hair);color:var(--dim);font-size:13px;display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between}
.foot a{color:var(--fog);text-decoration:none}
.foot a:hover{color:var(--chalk)}
.boot-error{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:var(--ink);z-index:100}
.boot-error[hidden]{display:none}
.boot-error .panel{max-width:420px;padding:24px;display:grid;gap:12px}
/* theory: section tabs */
.theory-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:26px}
.theory-tab{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:14px 16px;border-radius:16px;border:1px solid var(--rule);background:var(--surface);color:var(--fog);text-decoration:none;min-width:0;transition:border-color .15s,background .15s}
.theory-tab i{grid-row:span 2;font-size:24px;width:30px;text-align:center;color:var(--accent)}
.theory-tab b{font-size:17px;font-weight:800;letter-spacing:-.015em;color:var(--chalk);line-height:1.15}
.theory-tab small{font-size:13px;line-height:1.3;color:var(--fog);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theory-tab:hover{border-color:var(--accent-line)}
.theory-tab[aria-current="page"]{background:var(--accent);border-color:var(--accent)}
.theory-tab[aria-current="page"] i,.theory-tab[aria-current="page"] b,.theory-tab[aria-current="page"] small{color:var(--accent-ink)}
@media (max-width:620px){.theory-tab{grid-template-columns:1fr;justify-items:center;row-gap:6px;padding:12px 6px 11px;text-align:center}.theory-tab i{grid-row:auto;font-size:21px}.theory-tab b{font-size:14.5px}.theory-tab small{display:none}}
.zone{margin-top:48px}
.zone-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.zone-head h2{font-size:clamp(21px,4.4vw,27px)}
.zone-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.zone-free{color:var(--good);background:var(--good-soft)}
.zone-pro{color:var(--warn);background:var(--warn-soft)}
.zone>p{color:var(--fog);max-width:66ch;margin-bottom:16px}
.zone .section{margin-top:28px}
.cta-strip{display:grid;gap:12px;align-items:center;padding:18px;margin-top:14px;border-color:rgba(251,191,36,.35)}
@media (min-width:760px){.cta-strip{grid-template-columns:minmax(0,1fr) auto}}
.cta-strip h3{font-size:18px}.cta-strip p{color:var(--fog);margin-top:4px;font-size:14.5px}
/* think: tracks and the course card */
.track-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--fog);margin:0 0 8px}
.track-label .lock{margin-left:2px}
.course-card{display:grid;gap:14px;padding:20px;border-color:var(--accent-line)}
@media (min-width:820px){.course-card{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:22px}}
.course-card .badge-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:20px}
.course-card h3{font-size:19px}.course-card p{color:#cbd5e1;margin-top:6px;font-size:15px;max-width:62ch}
.why-order{margin-top:14px;color:var(--fog);font-size:14.5px;max-width:70ch}
/* trim: candidate moves */
.cp{margin-top:12px;border-radius:14px;background:var(--ink-2);border:1px solid var(--hair);overflow:hidden}
.cp-head{display:flex;align-items:center;gap:8px 12px;padding:10px 12px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.cp-eval{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;min-width:62px}
.cp-meta{font-size:12.5px;color:var(--fog);line-height:1.3;flex:1;min-width:120px}
.cp-meta b{color:var(--chalk);font-weight:700}
.cp-tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.cp-tools .seg button{padding:5px 10px;font-size:13px}
.cp-lines{list-style:none;margin:0;padding:0}
.cp-line{display:grid;grid-template-columns:10px 58px minmax(0,1fr);gap:10px;align-items:start;width:100%;padding:9px 12px;border:0;border-top:1px solid var(--hair);background:transparent;color:var(--chalk);text-align:left;font-size:13.5px}
.cp-lines li:first-child .cp-line{border-top:0}
.cp-line:hover{background:var(--raised)}
.cp-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--c,#38bdf8)}
.cp-score{text-align:center;font-weight:800;font-size:13px;line-height:1;padding:5px 4px;border-radius:6px;font-variant-numeric:tabular-nums}
.cp-score.w{background:#e2e8f0;color:#0f172a}.cp-score.b{background:#020617;color:#e2e8f0;box-shadow:inset 0 0 0 1px var(--rule)}
.cp-pv{color:#cbd5e1;font-variant-numeric:tabular-nums;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cp-pv b{color:var(--chalk)}
.cp-empty{padding:12px;color:var(--fog);font-size:13.5px}
/* upgrades */
.ladder{display:grid;gap:12px}
@media (min-width:900px){.ladder{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rung{padding:20px;display:flex;flex-direction:column;gap:10px}
.rung-step{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700;color:var(--fog)}
.rung-step i{font-size:16px;color:var(--accent)}
.rung h3{font-size:21px}
.rung>p{color:var(--fog);font-size:14.5px}
.rung ul{list-style:none;padding:0;display:grid;gap:8px;font-size:14.5px;color:#cbd5e1}
.rung li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}
.rung li i{color:var(--good);margin-top:5px;font-size:12px}
.rung .btn{margin-top:auto;align-self:flex-start}
.rung-top{border-color:rgba(251,191,36,.38)}.rung-top .rung-step i{color:var(--warn)}
.gateway{border-color:var(--accent-line);overflow:hidden;max-width:760px}
.gateway-head{padding:18px 18px 14px;display:grid;gap:8px;border-bottom:1px solid var(--hair);background:var(--accent-soft)}
.gateway-head h3{font-size:20px;display:flex;align-items:center;gap:10px}
.gateway-head h3 i{color:var(--accent)}
.gateway-head p{color:#cbd5e1;font-size:15px;max-width:62ch}
.gateway .bot{padding:16px}
.access-card{display:grid;gap:14px;padding:20px;max-width:640px}
.access-status{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--ink-2);border:1px solid var(--hair)}
.access-status .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--fog);font-size:16px}
.access-status.is-on .ico{background:var(--warn-soft);color:var(--warn)}
.access-status strong{display:block}
.access-status span{font-size:13.5px;color:var(--fog)}
/* about */
.founder-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 20px;align-items:center;padding:20px}
@media (min-width:820px){.founder-card{grid-template-columns:auto minmax(0,1fr) auto;padding:24px}}
.avatar{width:96px;height:96px;border-radius:24px;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font-size:38px;font-weight:800;color:var(--accent);border:1px solid var(--accent-line);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.founder-card h2{font-size:clamp(22px,4.6vw,28px)}
.creds{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:7px}
.creds li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:center;font-size:15px;color:#cbd5e1}
.creds i{color:var(--accent);text-align:center}
.founder-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
@media (min-width:820px){.founder-actions{grid-column:auto;flex-direction:column;align-items:stretch}}
.journey{list-style:none;margin:0;padding:0;max-width:760px}
.journey li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:16px;position:relative;padding-bottom:30px}
.journey li::before{content:"";position:absolute;left:14px;top:34px;bottom:4px;width:2px;background:var(--rule)}
.journey li:last-child{padding-bottom:0}.journey li:last-child::before{display:none}
.j-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;border:1px solid var(--accent-line)}
.j-label{font-size:13px;color:var(--fog);font-weight:700;margin-top:5px}
.j-title{font-size:clamp(19px,3.6vw,23px);margin-top:3px}
.j-text{font-family:var(--read);font-size:clamp(17px,2.2vw,19px);line-height:1.62;color:#dbe3ec;margin-top:8px;max-width:64ch}
/* admin: top-bar button, inline edit controls, content manager */
.topbar-right{grid-area:chip;display:flex;align-items:center;gap:8px;justify-self:end;min-width:0}
.admin-chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;border:1px dashed var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:800}
.admin-chip:hover{border-style:solid}
@media (max-width:420px){.admin-chip span{display:none}.admin-chip{width:36px;padding:0;justify-content:center}}
.cms-edit{display:inline-grid;place-items:center;width:28px;height:28px;margin-left:8px;border-radius:8px;border:1px dashed var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:12px;vertical-align:middle;flex:none;line-height:1;letter-spacing:0}
.cms-edit:hover{border-style:solid}
.cms-manage{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:9px;border:1px dashed var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:800;white-space:nowrap}
.cms-manage:hover{border-style:solid}
.cms-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-6px 0 18px;padding:10px 12px;border-radius:12px;border:1px dashed var(--accent-line);background:var(--accent-soft);font-size:13.5px;color:#cbd5e1}
.cms-bar strong{color:var(--accent)}
.cms-list{display:grid;gap:6px}
.cms-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--hair);background:var(--ink-2)}
.cms-item b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cms-item small{display:block;color:var(--fog);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cms-item .rep-actions .icon-btn{width:34px;height:34px}
.cms-form{display:grid;gap:12px}
.cms-form fieldset{border:1px solid var(--hair);border-radius:12px;padding:10px 12px 12px;margin:0;display:grid;gap:10px;min-width:0}
.cms-form legend{font-size:13px;font-weight:800;color:var(--fog);padding:0 6px}
.cms-form .input{font-size:15px}
.cms-form textarea.input{min-height:74px;font-size:14px}
.cms-form textarea.cms-json{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;min-height:110px}
.cms-sub{display:flex;gap:6px;flex-wrap:wrap}
.cms-err{color:var(--miss);font-size:13.5px;min-height:18px}
.cms-ok{color:var(--good)}
.cms-fen{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:start}
.cms-fen .board-host{max-width:120px}
.fen-row{display:flex;gap:8px;align-items:center}
.fen-row .input{flex:1;min-width:0}
/* admin board editor */
.be-board{width:100%;max-width:min(76vw,330px);margin:0 auto}
.be-board .lc-board{position:relative}
.be-palette{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.be-palette button{aspect-ratio:1/1;display:grid;place-items:center;padding:5px;border:1px solid var(--hair);border-radius:10px;background:var(--ink-2)}
.be-palette button img{width:100%;height:100%;display:block}
.be-palette button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.be-flags{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.be-flags label{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--fog)}
.be-fen{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:.01em}
.be-state{display:grid;gap:4px;padding:10px 12px;border-radius:12px;background:var(--ink-2);border:1px solid var(--hair);font-size:12.5px;color:var(--fog)}
.be-state.is-bad{border-color:rgba(251,113,133,.5);color:var(--miss)}
/* drill mode pin + data screen */
.mode-pin{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--hair);background:var(--ink-2);color:var(--fog);font-size:12px;font-weight:700;white-space:nowrap}
.mode-pin[data-v="interactive"]{border-color:var(--accent-line);color:var(--accent)}
.mode-pin[data-v="static"]{border-color:rgba(251,191,36,.55);color:var(--warn)}
.data-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.data-stats div{padding:10px 12px;border-radius:12px;background:var(--ink-2);border:1px solid var(--hair)}
.data-stats b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.data-stats span{font-size:12px;color:var(--fog)}
.cms-key{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;font-weight:700;letter-spacing:.04em;padding:12px;border-radius:12px;background:var(--ink-2);border:1px dashed var(--accent-line);text-align:center;word-break:break-all}
.otp{font-size:24px;letter-spacing:.35em;text-align:center;font-variant-numeric:tabular-nums}
.snippet{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--ink-2);border:1px solid var(--hair);border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;color:#cbd5e1}
.menu-rows{display:grid;border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.menu-rows button{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 14px;border:0;border-top:1px solid var(--hair);background:var(--ink-2);color:var(--chalk);text-align:left;font-size:15px;font-weight:700}
.menu-rows button:first-child{border-top:0}
.menu-rows button:hover{background:var(--raised)}
.menu-rows button i:first-child{color:var(--accent);text-align:center}
.menu-rows small{display:block;color:var(--fog);font-weight:600;font-size:12.5px}
/* ---------- v3.1: Think modes, Shuffle Trainer, AI bots, tier gating, About ---------- */
.theory-tabs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.theory-tab b i{grid-row:auto;font-size:13px;width:auto;margin-left:4px}
.theory-tab b .fa-crown{color:var(--warn)}.theory-tab b .fa-lock{color:var(--accent)}
#sh-board{position:relative}
.sh-setup{padding:18px;display:grid;gap:18px}
@media (min-width:640px){.sh-setup{padding:22px}}
.sh-setup h2{font-size:clamp(21px,4.4vw,27px)}
.sh-group{display:grid;gap:8px}
.sh-label{font-size:12.5px;font-weight:800;color:var(--fog);text-transform:uppercase;letter-spacing:.07em}
.sh-scopes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:760px){.sh-scopes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sh-scope{display:grid;gap:3px;align-content:start;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--rule);background:var(--ink-2);color:var(--chalk);min-width:0;transition:border-color .15s,background .15s,transform .08s}
.sh-scope:hover{border-color:var(--accent-line)}
.sh-scope:active{transform:translateY(1px)}
.sh-scope>i{font-size:19px;color:var(--accent);margin-bottom:4px}
.sh-scope b{font-size:16px;font-weight:800}
.sh-scope b i{font-size:12px;margin-left:4px}
.sh-scope b .fa-crown{color:var(--warn)}.sh-scope b .fa-lock{color:var(--accent)}
.sh-scope small{font-size:12.5px;color:var(--fog);line-height:1.3}
.sh-scope small:last-child{color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.sh-scope[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sh-scope[aria-pressed="true"] small:last-child{color:var(--accent)}
.sh-toggles{display:grid;gap:12px;padding:14px;border-radius:14px;background:var(--ink-2);border:1px solid var(--hair)}
.sh-toggles input[type="checkbox"],.sh-bar input[type="checkbox"]{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.sh-lockline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;border:1px solid rgba(251,191,36,.35);background:var(--warn-soft);font-size:14px;color:#fde68a}
.sh-start{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sh-start .btn-primary{min-height:48px;padding:0 22px;font-size:16px}
.sh-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:12px 0 14px}
.sh-bar .switch-row{gap:8px}
.sh-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.sh-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sh-missed{display:grid;gap:6px;margin-top:8px}
.sh-title-hidden{display:inline-flex;align-items:center;gap:8px;color:var(--fog)}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:var(--r-lg);overflow:hidden}
.hud>div{background:var(--surface);padding:10px 8px;text-align:center;min-width:0}
.hud b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.hud span{display:block;font-size:11.5px;color:var(--fog);line-height:1.25;margin-top:2px}
.hud-combo b{color:var(--accent)}
.hud-combo.is-hot b{color:var(--warn);text-shadow:0 0 18px rgba(251,191,36,.45)}
@media (max-width:440px){.hud b{font-size:18px}.hud span{font-size:10.5px}}
.flash{position:absolute;inset:0;display:grid;place-items:center;z-index:6;pointer-events:none;border-radius:8px;animation:flashIn 1s ease-out both}
.flash[hidden]{display:none}
.flash>div{display:grid;gap:4px;justify-items:center;padding:14px 22px;border-radius:16px;background:rgba(15,23,42,.88);border:1px solid var(--accent-line);text-align:center;max-width:82%;box-shadow:0 18px 40px -12px rgba(2,6,23,.8)}
.flash b{font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1}

.lb-rank{font-weight:800;color:var(--fog);font-variant-numeric:tabular-nums;text-align:center}
.lb-row:nth-child(-n+3) .lb-rank{color:var(--warn)}
.lb-name{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name em{font-style:normal;font-weight:600;font-size:12px;color:var(--dim);margin-left:8px}
.lb-val{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.lb-sub{grid-column:2/-1;font-size:12.5px;color:var(--fog)}
.lb-rules{margin-top:18px}
.lb-rules summary{cursor:pointer;font-weight:700}
.lb-rules p{margin-top:10px;color:#cbd5e1;font-size:14.5px;max-width:72ch}
/* ---------- v3.3: insights (admin) ---------- */
.ins-controls{display:grid;gap:10px;margin-bottom:18px}
.ins-controls .seg{justify-self:start;max-width:100%;overflow:visible;flex-wrap:wrap}
@media (max-width:520px){.ins-controls .seg button{padding:8px 10px;font-size:13.5px}}
.ins-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:18px;overflow:hidden;margin-top:10px}
@media (min-width:760px){.ins-sum{grid-template-columns:repeat(5,minmax(0,1fr))}}
.ins-sum div{background:var(--surface);padding:14px}
.ins-sum b{display:block;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ins-sum span{font-size:13px;color:var(--fog)}
.ins-sec{margin-top:28px}
.ins-sec h2{font-size:clamp(19px,4vw,23px)}
.ins-sec>p{color:var(--fog);font-size:14px;margin-top:4px;max-width:72ch}
.ins-wrap{overflow-x:auto;margin-top:12px;border:1px solid var(--hair);border-radius:14px}
.ins-table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.ins-table th{text-align:left;color:var(--fog);font-weight:600;font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
.ins-table td{padding:9px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
.ins-table tr:last-child td{border-bottom:0}
.ins-table td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ins-fail{display:inline-block;height:8px;border-radius:4px;background:var(--miss);vertical-align:middle;margin-right:6px;max-width:60px}
.ins-bars{display:grid;gap:9px;margin-top:12px}
.ins-bar{display:grid;grid-template-columns:minmax(96px,170px) minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:14px}
.ins-bar b{text-align:right;font-variant-numeric:tabular-nums}
.ins-bar.is-miss .lc-fill{background:var(--miss)}
.ins-ideas{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.ins-ideas li{padding:12px 14px;border-radius:12px;background:var(--surface);border-left:3px solid var(--warn);font-size:14.5px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.ins-q{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.ins-q li{padding:10px 12px;border-radius:10px;background:var(--surface);font-size:14px}
.ins-q small{display:block;color:var(--dim);margin-top:2px}
.ins-empty{padding:14px 16px;border-radius:14px;background:var(--surface);color:var(--fog);margin-top:10px}
.ins-export{margin-top:28px}
.adm-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.adm-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ink)}
.adm-list li span{display:block}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
</style>

function sha256(ascii) {

      hash[primes] = (Math.pow(cand, 0.5) * maxWord) | 0;
      k[primes++] = (Math.pow(cand, 1 / 3) * maxWord) | 0;
    }
  }
  hash = hash.slice(0, 8);
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = (bitLen / maxWord) | 0;
  words[words.length] = bitLen;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const old = hash;
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hash[0], e = hash[4];
      const t1 = hash[7] + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] +

      hash = [(t1 + t2) | 0].concat(hash);

const LEAKS = { threats: 'Blunders and missed threats', opening: 'Lost after the opening', plan: 'No plan in the middlegame', endgame: "Can't convert endgames", time: 'Time trouble and panic' };
const GOALS = { p200: '+200 rating', p400: '+400 rating', r1500: 'Reach 1500', r2000: 'Reach 2000' };
const TIERS = { free: { rank: 0, label: 'Free' }, community: { rank: 1, label: 'Community' }, vault: { rank: 2, label: 'Accelerator' }, mentor: { rank: 3, label: 'Mentorship' } };
const LOCK_RANK = { free: 0, community: 1, vault: 2 };
const LEAK_ROUTE = { threats: 'think', opening: 'openings', plan: 'middlegame', endgame: 'endgame', time: 'think' };
function bracketOf(elo) {
  if (elo == null) return null;
  if (elo < 800) return { id: 'foundation', label: '0–800' };
  if (elo < 1200) return { id: 'builder', label: '800–1200' };
  if (elo < 1600) return { id: 'climber', label: '1200–1600' };
  if (elo < 2000) return { id: 'contender', label: '1600–2000' };
  return { id: 'expert', label: '2000+' };
}
function cleanName(s) { return String(s || '').replace(/[\u0000-\u001f\u007f<>"'`\\]/g, '').replace(/\s+/g, ' ').trim().slice(0, 40); }
/* v3.3: the training profile.
   FOCUS: the Hyper-Focus habits, [name, the question asked before every move].
   STRUGGLES: what a player struggles with; interrogation verdicts add to it.
   REP: the repertoire choices (the hub teaches the Colle, the Caro-Kann and
   the Semi-Slav). */
const FOCUS = {
  M: ['M, reading their threats', 'Before every move: what does their last move attack, and what did it stop defending?'],
  S: ['S, spotting loose pieces', 'Before every move: which of my pieces are loose, and what does the structure ask for?'],
  P: ['P, forcing moves first', 'Before any quiet move: checks, captures and attacks, mine first, then theirs.'],
  C: ['C, calculating to the end', 'Before I touch a piece: calculate it to the end, including their best reply.']
};
const STRUGGLES = {
  threats: 'Missing my opponent’s threats', loose: 'Hanging pieces', forcing: 'Missing tactics and forcing moves',
  calc: 'Stopping my calculation too early', time: 'Time trouble', opening: 'Lost after the opening',
  plan: 'No plan in the middlegame', endgame: 'Converting won endgames', tilt: 'Tilt after a loss'
};
const REP = {
  w: { colle: 'Colle-Koltanowski', london: 'London System', qg: '1.d4 and the Queen’s Gambit', e4: '1.e4', other: 'Something else with White' },
  e4: { caro: 'Caro-Kann', e5: '1...e5', sicilian: 'Sicilian', french: 'French', other: 'Something else against 1.e4' },
  d4: { semislav: 'Semi-Slav', slav: 'Slav', qgd: 'Queen’s Gambit Declined', kid: 'King’s Indian', other: 'Something else against 1.d4' }
};
function sanitizeProfile(p) {
  p = p || {};
  const elo = parseInt(p.elo, 10), day = (d) => /^\d{4}-\d{2}-\d{2}$/.test(d || '');
  const r = p.rep && typeof p.rep === 'object' ? p.rep : {}, f = p.focus && typeof p.focus === 'object' ? p.focus : null;
  const ft = f ? String(f.text || '').replace(/[\u0000-\u001f\u007f<>]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140) : '';
  return {
    name: cleanName(p.name), elo: elo >= 100 && elo <= 3500 ? elo : null,
    leak: LEAKS[p.leak] ? p.leak : '', goal: GOALS[p.goal] ? p.goal : '',
    created: day(p.created) ? p.created : dayKey(new Date()),
    focus: f && (hasOwn(FOCUS, f.k) || f.k === 'custom') && ft ? { k: f.k, text: ft, since: day(f.since) ? f.since : dayKey(new Date()) } : null,
    struggles: (Array.isArray(p.struggles) ? p.struggles : []).filter((k, i, a) => hasOwn(STRUGGLES, k) && a.indexOf(k) === i).slice(0, 9),
    rep: { w: hasOwn(REP.w, r.w) ? r.w : '', e4: hasOwn(REP.e4, r.e4) ? r.e4 : '', d4: hasOwn(REP.d4, r.d4) ? r.d4 : '' },
    openings: (Array.isArray(p.openings) ? p.openings : []).map((o) => cleanName(o).slice(0, 40)).filter((o, i, a) => o && a.indexOf(o) === i).slice(0, 8),
    checkins: (Array.isArray(p.checkins) ? p.checkins : []).filter((c) => c && day(c.d) && [0, 1, 2].indexOf(c.r) >= 0).map((c) => ({ d: c.d, r: c.r })).slice(-60)
  };
}

const KEYS = { state: 'lc-hub-v2', rep: 'lc-hub-repertoire-v2', repV1: 'lc-hub-repertoire-v1' };
const App = {
  profile: sanitizeProfile({}),
  access: { tier: 'free', key: '', keyHash: '', verifiedAt: '', source: '', remote: false },
  stats: {}, progress: {}, daily: { last: '', count: 0 }, settings: { sound: true, board: false, autoVault: true }, onboarded: false,
  ui: {},
  load() {
    const s = Store.get(KEYS.state, null);
    if (!s || typeof s !== 'object') return;
    this.profile = sanitizeProfile(s.profile);
    const a = s.access || {};
    this.access = {
      tier: TIERS[a.tier] ? a.tier : 'free', keyHash: /^[0-9a-f]{64}$/.test(a.keyHash || '') ? a.keyHash : '',
      verifiedAt: String(a.verifiedAt || '').slice(0, 40), source: String(a.source || '').slice(0, 30), remote: !!a.remote,
      label: cleanName(a.label || ''), exp: /^\d{4}-\d{2}-\d{2}$/.test(a.exp || '') ? a.exp : '', bound: !!a.bound,
      pending: typeof a.pending === 'string' && /^LC-[A-Za-z0-9_-]{2,120}$/.test(a.pending) ? a.pending : '', checkedAt: String(a.checkedAt || '').slice(0, 40),
      key: typeof a.key === 'string' && /^LC-[A-Za-z0-9_-]{2,120}$/.test(a.key) ? a.key : ''
    };
    this.stats = {};
    Object.keys(s.stats || {}).forEach((key) => {
      const v = s.stats[key] || {};
      if (/^[a-z]{2,20}$/.test(key)) this.stats[key] = { tries: +v.tries || 0, correct: +v.correct || 0, streak: +v.streak || 0, best: +v.best || 0 };
    });
    this.progress = {};
    Object.keys(s.progress || {}).slice(0, 600).forEach((key) => {
      const v = s.progress[key] || {};
      this.progress[String(key).slice(0, 90)] = { best: clamp(+v.best || 0, 0, 1), runs: +v.runs || 0, last: +v.last || 0 };
    });
    this.daily = { last: String((s.daily || {}).last || '').slice(0, 10), count: +(s.daily || {}).count || 0 };
    this.settings = Object.assign({ sound: true, board: false, autoVault: true }, s.settings || {});
    this.onboarded = !!s.onboarded;
  },
  save() { Store.set(KEYS.state, { v: 2, profile: this.profile, access: this.access, stats: this.stats, progress: this.progress, daily: this.daily, settings: this.settings, onboarded: this.onboarded }); },
  rank() { const pv = Admin.preview(); return pv ? TIERS[pv].rank : (TIERS[this.access.tier] || TIERS.free).rank; },
  unlocked(item) { return this.rank() >= (LOCK_RANK[(item && item.lock) || 'free'] || 0); },
  isPro() { return this.rank() >= 2; },
  /* Module access: the tiers in GATES, changed in admin mode (Content gating). */
  can(g) { return this.rank() >= (LOCK_RANK[gateLevel(g)] || 0); },
  stat(section) { return this.stats[section] || (this.stats[section] = { tries: 0, correct: 0, streak: 0, best: 0 }); },
  score(section, ok) {
    const s = this.stat(section);
    s.tries++;
    if (ok) { s.correct++; s.streak++; s.best = Math.max(s.best, s.streak); this.touchDaily(); } else s.streak = 0;
    if (ok && [5, 10, 20, 30, 50, 100].indexOf(s.streak) >= 0) setTimeout(() => Celebrate.streak(s.streak), 380);
    this.save();
    refreshMetrics(section, ok);
    refreshChip();
  },
  finish(id, accuracy) {
    if (!id) return;
    const p = this.progress[id] || { best: 0, runs: 0, last: 0 };
    p.runs++; p.best = Math.max(p.best, clamp(accuracy, 0, 1)); p.last = Date.now();
    this.progress[id] = p; this.touchDaily(); this.save(); refreshChip();
  },
  touchDaily() {
    const today = dayKey(new Date());
    if (this.daily.last === today) return;
    const y = new Date(); y.setDate(y.getDate() - 1);
    this.daily.count = this.daily.last === dayKey(y) ? this.daily.count + 1 : 1;
    this.daily.last = today;
  },
  streakDays() {
    const y = new Date(); y.setDate(y.getDate() - 1);
    return this.daily.last === dayKey(new Date()) || this.daily.last === dayKey(y) ? this.daily.count : 0;
  },
  totals() {
    let tries = 0, correct = 0, best = 0;
    Object.keys(this.stats).forEach((key) => { const s = this.stats[key]; tries += s.tries; correct += s.correct; best = Math.max(best, s.best); });
    return { tries, correct, accuracy: tries ? Math.round(correct / tries * 100) : 0, best, drills: Object.keys(this.progress).length };
  }
};

/* LC- tokens: portable profile tokens (LC-P1-...) and member keys (anything else starting with LC-).
   v3: keys carry a member name, an optional end date and an off switch (set in admin mode); an
   optional activation server burns every key to one device; and a profile token no longer carries
   membership. In v2 it restored access from a key-hash prefix, which anyone could forge from the
   hashes in this file. */
const Access = (() => {
  const PREFIX = 'LC-P1-';
  const RE = /^LC-[A-Za-z0-9_-]{2,1490}$/i;   // any case: members type keys on phones
  const fails = [];
  function clean(raw) {
    const t = String(raw == null ? '' : raw).replace(/[\u0000-\u0020\u007f\u200b-\u200d\ufeff]/g, '');
    if (!t || t.length > 1500) return null;
    return RE.test(t) ? t : null;
  }
  const hashKey = (key) => sha256('lc-key|' + String(key).trim().toUpperCase());
  function keyList() {
    return (CONFIG.access.keys || []).map((k) => Object.assign({ label: '', exp: '', revoked: false }, k))
      .concat(Site.keys())
      .concat(CONFIG.access.demoKeys ? DEMO_KEYS.map((k) => Object.assign({ label: 'Demo', exp: '', revoked: false, demo: true }, k)) : [])
      .filter((k) => k && TIERS[k.tier] && k.tier !== 'free' && /^[0-9a-f]{64}$/.test(k.sha256 || ''));
  }
  const entryFor = (hash) => (hash ? keyList().filter((x) => x.sha256 === hash)[0] || null : null);
  const expired = (k) => !!(k && k.exp && k.exp < dayKey(new Date()));
  function throttled() { const now = Date.now(); while (fails.length && now - fails[0] > 60000) fails.shift(); return fails.length >= 5; }
  const blank = () => ({ tier: 'free', key: '', keyHash: '', verifiedAt: '', source: '', remote: false, label: '', exp: '', bound: false, pending: '', checkedAt: '' });
  function setAccess(tier, hash, source, extra) {
    App.access = Object.assign(blank(), { tier, keyHash: hash || '', verifiedAt: new Date().toISOString(), source: source || 'manual' }, extra || {});
    App.save();
  }
  function post(body) {
    return fetchWithTimeout(CONFIG.access.activationEndpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ device: deviceId(), app: 'lanckrietchess-hub', version: CONFIG.version }, body))
    }, CONFIG.access.timeoutMs).then((res) => res.json());
  }
  async function verify(key) {
    const hash = hashKey(key);
    if (!entryFor(hash) && Site.pending()) await Site.pending();   // first visit: wait for content.json
    const e = entryFor(hash);
    if (e) {
      if (e.revoked) return { ok: false, reason: 'revoked' };
      if (expired(e)) return { ok: false, reason: 'expired', exp: e.exp };
      return { ok: true, tier: e.tier, hash, entry: e };
    }
    if (!CONFIG.access.verifyEndpoint) return { ok: false, reason: 'invalid' };
    try {
      const res = await fetchWithTimeout(CONFIG.access.verifyEndpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: key, app: 'lanckrietchess-hub', version: CONFIG.version })
      }, CONFIG.access.timeoutMs);
      if (!res.ok) return { ok: false, reason: 'server' };
      const data = await res.json();
      if (data && data.valid === true && TIERS[data.tier] && data.tier !== 'free') return { ok: true, tier: data.tier, hash, remote: true };
      return { ok: false, reason: 'invalid' };
    } catch (err) { return { ok: false, reason: 'network' }; }
  }
  function encodeProfile() {
    const p = App.profile, t = App.totals();
    const payload = { v: 1, n: p.name, e: p.elo, l: p.leak, g: p.goal, t: App.access.tier, s: { a: t.accuracy, b: t.best, d: t.drills, m: t.tries }, c: p.created,
      f: p.focus, st: p.struggles, r: p.rep, o: p.openings, ci: p.checkins.slice(-14) };
    const body = b64url.enc(JSON.stringify(payload));
    return PREFIX + body + '-' + fnv(body);
  }
  function decodeProfile(tok) {
    const rest = tok.slice(PREFIX.length), cut = rest.lastIndexOf('-');
    if (cut < 1) return { ok: false, reason: 'format' };
    const body = rest.slice(0, cut);
    if (fnv(body) !== rest.slice(cut + 1)) return { ok: false, reason: 'checksum' };
    let data;
    try { data = JSON.parse(b64url.dec(body)); } catch (e) { return { ok: false, reason: 'format' }; }
    if (!data || typeof data !== 'object' || data.v !== 1) return { ok: false, reason: 'format' };
    return { ok: true, profile: sanitizeProfile({ name: data.n, elo: data.e, leak: data.l, goal: data.g, created: data.c, focus: data.f, struggles: data.st, rep: data.r, openings: data.o, checkins: data.ci }) };
  }
  const MSG = {
    invalid: 'This key is not active. Check the latest classroom post, or ask Kyenzo for your key.',
    revoked: 'This key was switched off. Ask Kyenzo for a new one.',
    expired: 'This key has expired. Renew your membership to get a new one.',
    bound: 'This key is already active on another device. Each key works on one device, so ask Kyenzo to reset it if you changed phones.',
    network: 'Could not reach the verification server. Try again in a moment.',
    server: 'The verification server returned an error. Try again shortly.'
  };
  async function accept(raw, source) {
    const tok = clean(raw);
    if (!tok) { fails.push(Date.now()); return { ok: false, message: 'That does not look like a Lanckrietchess token. Tokens start with LC-.' }; }
    if (tok.slice(0, PREFIX.length).toUpperCase() === PREFIX) {
      const r = decodeProfile(PREFIX + tok.slice(PREFIX.length));
      if (!r.ok) { fails.push(Date.now()); return { ok: false, message: r.reason === 'checksum' ? 'This profile token is incomplete. Copy the whole token and try again.' : 'This profile token cannot be read.' }; }
      App.profile = r.profile; App.onboarded = true; App.save();
      return { ok: true, message: 'Profile restored. Membership is not part of the profile: paste your member key to unlock this device.', kind: 'profile' };
    }
    const v = await verify(tok);
    if (!v.ok) {
      fails.push(Date.now());
      return { ok: false, message: v.reason === 'expired' && v.exp ? 'This key expired on ' + fmtDate(v.exp) + '. Renew your membership to get a new one.' : (MSG[v.reason] || 'Verification failed.') };
    }
    if (TIERS[v.tier].rank < App.rank() && entryFor(App.access.keyHash)) return { ok: true, message: 'You already have ' + TIERS[App.access.tier].label + ' access on this device.', tier: App.access.tier };
    /* The key itself stays on this device: the hub worker needs it to confirm
       the membership before the Pro coach answers. */
    const extra = { key: tok.toUpperCase(), remote: !!v.remote, label: v.entry ? v.entry.label || '' : '', exp: v.entry ? v.entry.exp || '' : '' };
    if (CONFIG.access.activationEndpoint && v.entry && !v.entry.demo) {
      try {
        const r = await post({ action: 'activate', token: tok });
        if (!r || !r.ok) { fails.push(Date.now()); return { ok: false, message: MSG[r && r.reason] || MSG.invalid }; }
        Object.assign(extra, { bound: true, checkedAt: new Date().toISOString(), label: r.label || extra.label });
      } catch (err) { extra.pending = tok.toUpperCase(); }   // offline: unlock now, confirm this device on the next launch
    }
    setAccess(v.tier, v.hash, source, extra);
    return { ok: true, message: TIERS[v.tier].label + ' unlocked' + (extra.label && extra.label !== 'Demo' ? ' for ' + extra.label : '') + '. Welcome in.', tier: v.tier, kind: 'key' };
  }
  function recheck() {
    const a = App.access;
    if (a.tier === 'free') return null;
    if (a.remote) {
      const age = Date.now() - new Date(a.verifiedAt).getTime();
      if (!(age < 30 * 864e5)) { signOut(); return 'expired'; }
      return null;
    }
    const e = entryFor(a.keyHash);
    if (!e) { if (!Site.known()) return null; signOut(); return 'expired'; }
    if (e.revoked) { signOut(); return 'revoked'; }
    if (expired(e)) { signOut(); return 'expired'; }
    if (e.tier !== a.tier) { a.tier = e.tier; App.save(); }
    return null;
  }
  async function recheckRemote() {
    const a = App.access;
    if (!CONFIG.access.activationEndpoint || a.tier === 'free' || a.remote) return null;
    const e = entryFor(a.keyHash);
    if (!e || e.demo) return null;
    const due = a.pending || !a.checkedAt || Date.now() - new Date(a.checkedAt).getTime() > (CONFIG.access.recheckDays || 7) * 864e5;
    if (!due) return null;
    try {
      const r = await post(a.pending ? { action: 'activate', token: a.pending } : { action: 'check', hash: a.keyHash });
      if (r && r.ok) { a.pending = ''; a.bound = true; a.checkedAt = new Date().toISOString(); App.save(); return null; }
      if (r && /^(bound|unbound|revoked|expired)$/.test(r.reason || '')) { signOut(); return r.reason; }
    } catch (err) { /* offline: check again on the next launch */ }
    return null;
  }
  function signOut() { App.access = blank(); App.save(); }
  return { clean, hashKey, accept, encodeProfile, decodeProfile, recheck, recheckRemote, signOut, throttled, PREFIX };
})();

function coachBriefing(extra) {
  const p = App.profile, b = bracketOf(p.elo), t = App.totals();
  const lines = ['[LANCKRIETCHESS PROFILE TOKEN]', Access.encodeProfile(), '',
    'Player: ' + (p.name || 'not set') + (p.elo ? ', rating ' + p.elo + ' (' + b.label + ')' : ''),
    'Main leak: ' + (LEAKS[p.leak] || 'not set'),
    'Goal: ' + (GOALS[p.goal] || 'not set'),
    'Hub stats: ' + t.accuracy + '% first-try accuracy over ' + t.tries + ' moves, best streak ' + t.best + ', membership ' + TIERS[App.access.tier].label + '.'];
  if (extra) lines.push('', extra);
  return lines.join('\n');
}

const Sound = (() => {
  let ctx = null;
  function note(freq, at, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + at;
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function play(seq) {
    if (!App.settings.sound) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      seq.forEach((n) => note(n[0], n[1], n[2], n[3], n[4]));
    } catch (e) { /* sound is optional */ }
  }
  return {
    move: () => play([[330, 0, 0.06, 'triangle', 0.05]]),
    capture: () => play([[220, 0, 0.09, 'triangle', 0.07]]),
    good: () => play([[660, 0, 0.09, 'sine', 0.05], [990, 0.07, 0.13, 'sine', 0.045]]),
    bad: () => play([[190, 0, 0.17, 'sawtooth', 0.025]]),
    done: () => play([[523, 0, 0.1, 'sine', 0.05], [659, 0.09, 0.1, 'sine', 0.05], [784, 0.18, 0.2, 'sine', 0.05]]),
    brilliant: () => play([[784, 0, 0.12, 'triangle', 0.05], [988, 0.08, 0.12, 'triangle', 0.05], [1175, 0.16, 0.14, 'triangle', 0.05], [1568, 0.27, 0.36, 'sine', 0.045]]),
    fanfare: () => play([[523, 0, 0.12, 'triangle', 0.05], [659, 0.11, 0.12, 'triangle', 0.05], [784, 0.22, 0.12, 'triangle', 0.05], [1047, 0.33, 0.3, 'sine', 0.05]])
  };
})();

/* ---------- UI primitives ---------- */
function toast(message, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' toast-' + kind : '');
  el.setAttribute('role', 'status');
  el.textContent = message;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('is-in'));
  setTimeout(() => { el.classList.remove('is-in'); setTimeout(() => el.remove(), 260); }, 2800);
}
function openSheet(opts) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = '<div class="sheet-backdrop" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">' +
    '<header class="sheet-head"><h2>' + esc(opts.title) + '</h2><button class="icon-btn" type="button" data-close aria-label="Close">' + icon('xmark') + '</button></header>' +
    '<div class="sheet-body">' + opts.html + '</div></section>';
  qs('#layer').appendChild(wrap);
  const prev = document.activeElement;
  const prevOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';
  let closed = false;
  function close() {
    if (closed) return; closed = true;
    wrap.classList.add('is-closing');
    document.removeEventListener('keydown', onKey);
    document.body.style.overflow = prevOverflow;
    setTimeout(() => wrap.remove(), 200);
    if (opts.onClose) opts.onClose();
    if (prev && prev.focus) try { prev.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  function onKey(e) { if (e.key === 'Escape') close(); }
  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey);
  requestAnimationFrame(() => {
    wrap.classList.add('is-open');
    const f = qs('.sheet-body input:not([type=radio]), .sheet-body textarea, .sheet-body button, .sheet-body a[href]', wrap);
    if (f && !opts.noFocus) try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  });
  const api = { el: qs('.sheet', wrap), close };
  if (opts.onMount) opts.onMount(api);
  return api;
}
function confirmSheet(title, text, yes) {
  return new Promise((resolve) => {
    let answered = false;
    openSheet({
      title, noFocus: true,
      html: '<p class="muted">' + esc(text) + '</p><div class="btn-row"><button class="btn btn-primary" data-yes type="button">' + esc(yes || 'Confirm') + '</button><button class="btn btn-ghost" data-close type="button">Cancel</button></div>',
      onMount(s) { qs('[data-yes]', s.el).addEventListener('click', () => { answered = true; resolve(true); s.close(); }); },
      onClose() { if (!answered) resolve(false); }
    });
  });
}
function metric(value, label, ico, key) {
  return '<div class="metric"' + (key ? ' data-metric="' + key + '"' : '') + '><span class="metric-icon">' + icon(ico) + '</span><span class="metric-value">' + esc(value) + '</span><span class="metric-label">' + esc(label) + '</span></div>';
