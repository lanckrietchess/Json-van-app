/* ---------- WebCrypto helpers (admin sign-in) ---------- */
const Crypt = (() => {
  const ok = () => !!(window.crypto && window.crypto.subtle && window.isSecureContext !== false);

/* IndexedDB: holds the non-extractable key that encrypts the admin token. */
const IDB = {
  open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('no indexedDB')); return; }
      let req;
      try { req = indexedDB.open('lc-hub', 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => { req.result.createObjectStore('keys'); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  run(mode, fn) {
    return this.open().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction('keys', mode), req = fn(tx.objectStore('keys'));
      tx.oncomplete = () => { db.close(); resolve(req ? req.result : undefined); };
      tx.onerror = () => { db.close(); reject(tx.error); };
      tx.onabort = () => { db.close(); reject(tx.error); };
    }));
  },
  get(k) { return this.run('readonly', (s) => s.get(k)); },
  put(k, v) { return this.run('readwrite', (s) => s.put(v, k)); },
  del(k) { return this.run('readwrite', (s) => s.delete(k)); }
};
/* A random ID per browser. Member keys and admin sessions are bound to it. */
function deviceId() {
  let id = Store.get('lc-hub-device', '');
  if (!/^d-[a-z0-9]{12,40}$/.test(id || '')) {
    id = 'd-' + Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => (b < 36 ? '0' : '') + b.toString(36)).join('').slice(0, 20);
    Store.set('lc-hub-device', id);
  }
  return id;
}


/* ---------- AI transport: one POST to your hub worker per message ----------
   The worker (hub-worker.js) picks the bot's published instructions from
   content.json, checks the member key before the Pro coach answers, and calls
   the model. The API key lives in the worker, never in this file. Without
   CONFIG.ai.endpoint nothing is sent: the built-in coach and the scripted
   assistant answer instead. */
const AI = (() => {
  const endpoint = () => String((CONFIG.ai && CONFIG.ai.endpoint) || '').trim();
  const on = () => /^https:\/\/\S+$/i.test(endpoint()) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/\S*)?$/i.test(endpoint());
  const clip = (s, n) => String(s == null ? '' : s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '').slice(0, n);
  const vars = () => ({ peak: clip(CONFIG.peakRating, 20), start: clip(CONFIG.startRating, 20), percentile: clip(CONFIG.percentile, 40), coach: clip(CONFIG.coach, 40), fasttrack: clip(CONFIG.fastTrack, 60) });
  /* Roles must alternate and start with the player. */
  function norm(messages) {
    const out = [];
    (messages || []).forEach((m) => {
      if (!m || (m.role !== 'user' && m.role !== 'assistant')) return;
      const content = clip(m.content, 2000).trim();
      if (!content) return;
      if (out.length && out[out.length - 1].role === m.role) out[out.length - 1].content += '\n\n' + content;
      else out.push({ role: m.role, content });
    });
    while (out.length && out[0].role !== 'user') out.shift();
    return out.slice(-16);
  }
  const fail = (reason) => Object.assign(new Error(reason), { reason });
  async function chat(bot, messages, context, extra) {
    if (!on()) throw fail('off');
    if (navigator.onLine === false) throw fail('offline');
    const a = App.access;
    const body = Object.assign({ action: 'chat', bot, messages: norm(messages), context: context || {}, vars: vars(), device: deviceId(), app: 'lanckrietchess-hub', version: CONFIG.version }, extra || {});
    if (a.key) body.token = a.key; else if (a.keyHash) body.hash = a.keyHash;
    if (!body.messages.length || body.messages[body.messages.length - 1].role !== 'user') throw fail('empty');
    let res, data = null;
    try {
      res = await fetchWithTimeout(endpoint(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, (CONFIG.ai && CONFIG.ai.timeoutMs) || 25000);
      data = await res.json();
    } catch (e) { throw fail('network'); }
    if (!res.ok || !data || data.ok !== true) throw fail((data && typeof data.reason === 'string' && data.reason.slice(0, 30)) || 'server');
    const text = clip(data.reply, 6000).trim();
    if (!text) throw fail('empty');
    return { text, tier: data.tier === 'paid' ? 'paid' : 'free' };
  }
  /* [[PATH:bridge]] style tags: the bot asks for a button, the app draws it from CONFIG links. */
  function tags(text) {
    const found = [];
    const clean = String(text || '').replace(/\[\[\s*([A-Za-z]{2,12})\s*:\s*([A-Za-z0-9-]{1,20})\s*\]\]/g, (m, k, v) => { found.push([k.toUpperCase(), v.toLowerCase()]); return ''; }).replace(/\n{3,}/g, '\n\n').trim();
    return { clean, found };
  }
  const host = () => { try { return new URL(endpoint()).host; } catch (e) { return ''; } };
  return { on, chat, tags, endpoint, host, norm };
})();

  return plies.length === toks.length ? '' : 'Move ' + (plies.length + 1) + ' (“' + toks[plies.length] + '”) is not legal in that position' + (silent ? ', not even as a static drill.' : '.');

function checkItem(name, it) {
  if (!it || typeof it !== 'object' || Array.isArray(it)) return 'This item is not readable.';
  const ids = ['think', 'spotlights', 'openings', 'bridge', 'middlegame', 'endgame', 'courses.middlegame', 'courses.antiblunder', 'courses.endgame'];
  if (ids.indexOf(name) >= 0 && !(typeof it.id === 'string' && /^[\w-]{2,60}$/.test(it.id))) return 'Every item needs an id made of letters, numbers and dashes.';
  if (it.lock && !Object.prototype.hasOwnProperty.call(LOCK_RANK, it.lock)) return 'lock must be free, community or vault.';
  if (it.mode && it.mode !== 'interactive' && it.mode !== 'static') return 'mode must be interactive or static.';
  if (it.fen != null && !fenOk(it.fen)) return 'The FEN is not a legal position.';
  try {
    if (name === 'openings' || name === 'spotlights') return lineOk(START_FEN, it.pgn, isStatic(it));
    if (name === 'groups') return it.name ? '' : 'A repertoire needs a name.';
    if (name === 'think' || name === 'middlegame') {
      if (!Array.isArray(it.stages) || !it.stages.length) return 'Add at least one stage.';
      for (const st of it.stages) {
        if (!st || typeof st !== 'object') return 'A stage is not readable.';
        if (st.type === 'mcq') { if (!Array.isArray(st.options) || st.options.length < 2 || !st.options.some((o) => o && o.correct)) return 'Every question needs at least two options and one correct answer.'; }
        else if (st.type === 'tap') { if (!Array.isArray(st.answer) || !st.answer.length || !st.answer.every((q) => SQ_RE.test(q))) return 'A tap stage needs answer squares like d6.'; }
        else if (st.type === 'move') { const e = sansOk(it.fen, st.accept, 'accept'); if (e) return e; if (!Object.keys(st.accept || {}).length) return 'A move stage needs at least one accepted move.'; }
        else if (st.type === 'line') { const e = lineOk(it.fen, st.pgn, isStatic(st) || isStatic(it)); if (e) return e; }
        else return 'Stage type must be mcq, tap, move or line.';
      }
      return '';
    }
    if (name === 'bridge') return sansOk(it.fen, (it.drill || {}).accept, 'drill.accept') || ((it.keySquares || []).every((q) => SQ_RE.test(q)) ? '' : 'keySquares must be squares like e4.');
    if (name === 'endgame') {
      if (it.type === 'kpk') return String(it.fen).split(' ')[0].replace(/[^a-zA-Z]/g, '').split('').sort().join('') === 'KPk' ? '' : 'A king-and-pawn drill needs exactly a white king, a white pawn and a black king.';
      return lineOk(it.fen, it.pgn, isStatic(it));
    }
    if (name.indexOf('courses.') === 0) {
      if (!Array.isArray(it.steps) || !it.steps.length) return 'A lesson needs at least one exercise.';
      for (const st of it.steps) {
        if (!st || st.ref) continue;
        if (!fenOk(st.fen)) return 'Exercise “' + (st.id || '?') + '” has an illegal FEN.';
        if (st.type !== 'kpk') { const e = lineOk(st.fen, st.pgn, isStatic(st) || isStatic(it)); if (e) return 'Exercise “' + (st.id || '?') + '”: ' + e; }
      }
    }
  } catch (e) { return 'This item could not be read: ' + e.message; }
  return '';
}

  function cleanSetting(v, type) {

    SETTINGS.forEach((s) => { const v = getPath(doc.settings || {}, s[0]); if (v === undefined) return; const c = cleanSetting(v, s[2]); if (c !== undefined) setPath(out.settings, s[0], c); });

})();

/* ---------- Admin: sign-in, session, local draft ---------- */
const ADMIN_TOKEN = 'LANCKRIETCHESS_ADMIN_TOKEN';
const Admin = (() => {
  let active = false;
  const prefs = Object.assign({ edit: true, preview: '', tier: 'free' }, Store.get('lc-admin-ui', {}) || {});
  const LS_DRAFT = 'lc-admin-draft', LS_BOOK = 'lc-admin-keybook', LS_FAILS = 'lc-admin-fails', LS_LAST = 'lc-admin-otp-last';
  const cfg = () => CONFIG.admin || {};
  const configured = () => { const a = cfg(); return /^[0-9a-f]{64}$/.test(a.emailCheck || '') && String(a.salt || '').length >= 16 && String(a.secretBox || '').length > 30; };
  const isTrigger = (v) => String(v == null ? '' : v).replace(/\s+/g, '').toUpperCase() === String(cfg().trigger || 'LANCKRIET_ADMIN_MODE').toUpperCase();
  function fails() { const now = Date.now(), f = (Store.get(LS_FAILS, []) || []).filter((t) => now - t < 600000); Store.set(LS_FAILS, f); return f; }
  const locked = () => fails().length >= 5;
  const fail = () => { const f = fails(); f.push(Date.now()); Store.set(LS_FAILS, f); };
  /* Returns the authenticator secret when the email is right, otherwise null. */
  async function checkEmail(email) {
    const bits = await Crypt.pbkdf2(String(email || '').trim().toLowerCase(), Crypt.B64.dec(cfg().salt), cfg().iterations || 310000);
    if (Crypt.hex(bits.slice(32)) !== cfg().emailCheck) return null;
    try { return await Crypt.open(bits.slice(0, 32), cfg().secretBox); } catch (e) { return null; }
  }
  async function checkCode(secret, code) {
    code = String(code || '').replace(/\D/g, '');
    if (code.length !== 6) return false;
    const now = Math.floor(Date.now() / 30000), last = +Store.get(LS_LAST, 0) || 0;
    for (const c of [now - 1, now, now + 1]) {
      if (c > last && (await Crypt.hotp(secret, c)) === code) { Store.set(LS_LAST, c); return true; }
    }
    return false;
  }
  async function startSession() {
    const now = Date.now(), exp = now + (cfg().sessionDays || 14) * 864e5;
    const payload = new TextEncoder().encode(JSON.stringify({ role: 'admin', dev: deviceId(), cfg: cfg().emailCheck.slice(0, 16), iat: now, exp }));
    try {
      const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      const iv = Crypt.rand(12), ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, payload));
      await IDB.put('admin-session', key);
      const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
      Store.set(ADMIN_TOKEN, Crypt.B64.enc(all));
    } catch (e) { toast('This browser can’t remember the admin session. You will sign in again next time.'); }
    active = true; Store.set(LS_FAILS, []);
    Site.apply();
  }
  async function restore() {
    if (!configured() || !Crypt.ok()) return false;
    const tok = Store.get(ADMIN_TOKEN, null);
    if (typeof tok !== 'string') return false;
    try {
      const key = await IDB.get('admin-session');
      if (!key) throw new Error('no session key');
      const all = Crypt.B64.dec(tok);
      const s = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(0, 12) }, key, all.slice(12))));
      if (s && s.role === 'admin' && s.exp > Date.now() && s.dev === deviceId() && s.cfg === cfg().emailCheck.slice(0, 16)) { active = true; Site.apply(); return true; }
    } catch (e) { /* a token from another browser, or an expired one */ }
    Store.del(ADMIN_TOKEN);
    return false;
  }
  function signOut() { active = false; Store.del(ADMIN_TOKEN); IDB.del('admin-session').catch(() => {}); Site.apply(); }
  const draft = () => Site.cleanDoc(Store.get(LS_DRAFT, null));
  const ensureDraft = () => draft() || clone(Site.published() || Site.emptyDoc());
  function saveDraft(d) { d.updated = new Date().toISOString(); Store.set(LS_DRAFT, d); Site.apply(); }
  function discardDraft() { Store.del(LS_DRAFT); Site.apply(); }
  function dirty() {
    const d = draft();
    if (!d) return false;
    const strip = (x) => JSON.stringify(Object.assign({}, x || Site.emptyDoc(), { updated: '' }));
    return strip(d) !== strip(Site.published());
  }
  const keybook = () => Store.get(LS_BOOK, {}) || {};
  const saveKeybook = (b) => Store.set(LS_BOOK, b);
  function setPref(k, v) { prefs[k] = v; Store.set('lc-admin-ui', prefs); }
  /* The tier switcher: which tier you are editing, and the preview that goes with it. */
  function setEditTier(t) {
    prefs.tier = t === 'paid' ? 'paid' : 'free';
    prefs.preview = prefs.tier === 'paid' ? 'vault' : 'free';
    Store.set('lc-admin-ui', prefs);
  }
  return {
    get active() { return active; },
    configured, isTrigger, locked, fail, checkEmail, checkCode, startSession, restore, signOut,
    draft, ensureDraft, saveDraft, discardDraft, dirty, keybook, saveKeybook, setPref, setEditTier,
    prefs: () => prefs,
    editTier: () => (prefs.tier === 'paid' ? 'paid' : 'free'),
    editing: () => active && prefs.edit !== false,
    preview: () => (active && prefs.preview && TIERS[prefs.preview] ? prefs.preview : '')
  };
})();

          if (e.target.closest('[data-cancel]')) { s.close(); later(() => listSheet(n)); }
        });
        qs('#it-form', s.el).addEventListener('submit', (e) => {
          e.preventDefault();

          if (!isObj(it)) { err.textContent = 'The item must be a JSON object.'; return; }
          if (ID_LISTS.indexOf(n) >= 0 && !it.id) it.id = slug(it.title || n) + '-' + Math.random().toString(36).slice(2, 6);
          const all = clone(getPath(CONTENT, n) || []);
          if (it.id && all.some((x, j) => j !== index && x.id === it.id)) { err.textContent = 'Another item already uses the id “' + it.id + '”.'; return; }
          const problem = checkItem(n, it);
          if (problem) { err.textContent = problem; return; }
          if (index >= 0) all[index] = it; else all.push(it);
          const d = Admin.ensureDraft(); d.lists[n] = all; Admin.saveDraft(d);
          s.close(); rerender(); saved(); later(() => listSheet(n));
        });
        draw();
      }
    });
  }

    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = Crypt.rand(12);

    return 'LC-' + ({ community: 'COMM', vault: 'ACC', mentor: 'MENTOR' })[tier] + '-' + x.slice(0, 4) + '-' + x.slice(4, 8) + '-' + x.slice(8);

  /* ----- board editor: free placement, no legality rules -----
     Pieces go wherever the admin puts them. chess.js is only asked whether it can
     read the result, so unorthodox setups (a missing king, three rooks, a tactical
     fragment) are all fine. The editor writes a FEN back into an item, or starts a
     new drill from the position. */
  const PIECE_ORDER = ['wK', 'wQ', 'wR', 'wB', 'wN', 'wP', 'bK', 'bQ', 'bR', 'bB', 'bN', 'bP'];
  const FEN_CHAR = { wK: 'K', wQ: 'Q', wR: 'R', wB: 'B', wN: 'N', wP: 'P', bK: 'k', bQ: 'q', bR: 'r', bB: 'b', bN: 'n', bP: 'p' };
  const FILES = 'abcdefgh';
  function fenToPos(placement) {
    const rows = String(placement || '').split('/'), pos = {};
    if (rows.length !== 8) return pos;
    for (let r = 0; r < 8; r++) {
      let file = 0;
      for (let i = 0; i < rows[r].length; i++) {
        const ch = rows[r].charAt(i);
        if (/[1-8]/.test(ch)) { file += +ch; continue; }
        const code = (ch === ch.toUpperCase() ? 'w' : 'b') + ch.toUpperCase();
        if (file < 8 && PIECE_ORDER.indexOf(code) >= 0) pos[FILES.charAt(file) + (8 - r)] = code;
        file++;
      }
    }
    return pos;
  }
  function posToPlacement(pos) {
    let out = '';
    for (let r = 8; r >= 1; r--) {
      let empty = 0;
      for (let f = 0; f < 8; f++) {
        const p = pos[FILES.charAt(f) + r];
        if (!p) { empty++; continue; }
        if (empty) { out += empty; empty = 0; }
        out += FEN_CHAR[p] || '';
      }
      if (empty) out += empty;
      if (r > 1) out += '/';
    }
    return out;
  }
  function fenParts(fen) {
    const p = String(fen || START_FEN).trim().split(/\s+/);
    return {
      pos: fenToPos(p[0] || ''), turn: p[1] === 'b' ? 'b' : 'w',
      castle: /^[KQkq]{1,4}$/.test(p[2] || '') ? p[2] : '',
      ep: /^[a-h][36]$/.test(p[3] || '') ? p[3] : '',
      move: clamp(parseInt(p[5], 10) || 1, 1, 999)
    };
  }
  function fenLists() {
    return Object.keys(Site.LISTS).filter((n) => {
      const t = template(n, getPath(CONTENT, n) || []);
      return isObj(t) && hasOwn(t, 'fen');
    });
  }

    const flag = (c, label) => '<label><input type="checkbox" data-castle="' + c + '"' + (st.castle.indexOf(c) >= 0 ? ' checked' : '') + '><span>' + label + '</span></label>';

        '<div class="be-board"><div class="lc-board"><div id="' + bid + '"></div></div></div>' +

        '<label class="field"><span class="field-label">FEN</span><textarea class="input be-fen" id="be-fen" rows="2" spellcheck="false" autocapitalize="off"></textarea><span class="field-hint">Paste a FEN here to load it onto the board.</span></label>' +
        '<div class="be-state" id="be-state"></div>' +
        '<div class="btn-row">' + (opts.onUse ? '<button type="button" class="btn btn-primary" data-be="use">' + icon('check') + ' Use this position</button>' : '') +
        '<button type="button" class="btn btn-ghost" data-be="save">' + icon('plus') + ' Save as a new drill</button>' +
        '<button type="button" class="btn btn-quiet" data-be="copy">' + icon('copy') + ' Copy FEN</button></div>',
      onClose() { if (cb) { try { cb.destroy(); } catch (e) { /* already gone */ } cb = null; } },
      onMount(s) {

          position: clone(st.pos), orientation: orient, draggable: true, dropOffBoard: 'trash', sparePieces: false,
          pieceTheme: pieceUrl, showNotation: true, moveSpeed: 140, trashSpeed: 100, appearSpeed: 120,
          onDrop(source, target, code) {
            dropAt = Date.now();                                    // the click that follows is ignored
            if (source === target) {                                // a tap on a piece, not a drag
              if (sel === 'erase' || st.pos[source] === sel) { delete st.pos[source]; Sound.capture(); }
              else { st.pos[source] = sel; Sound.move(); }
            } else {
              delete st.pos[source];
              if (target !== 'offboard' && /^[a-h][1-8]$/.test(target)) st.pos[target] = code;

        function paintPalette() { qsa('[data-piece]', s.el).forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-piece') === sel))); qs('[data-be="erase"]', s.el).setAttribute('aria-pressed', String(sel === 'erase')); }
        function sync(skipBoard) {
          if (!skipBoard && cb) cb.position(clone(st.pos), false);
          const fen = fenNow();

          const probe = new Chess(), ok = probe.load(fen), report = probe.validate_fen(fen);
          let wk = 0, bk = 0;
          Object.keys(st.pos).forEach((q) => { if (st.pos[q] === 'wK') wk++; else if (st.pos[q] === 'bK') bk++; });
          const notes = [];
          if (!wk || !bk) notes.push('No ' + (!wk && !bk ? 'kings' : !wk ? 'white king' : 'black king') + ' on the board. That is allowed: check detection and the engine simply stay quiet in this drill.');
          if (wk > 1 || bk > 1) notes.push('More than one king for a colour. Allowed here.');
          if (!ok) notes.push('The board cannot read this position yet: ' + (report.error || 'unknown reason'));
          stateEl.className = 'be-state' + (ok ? '' : ' is-bad');
          stateEl.innerHTML = '<span>' + (ok ? icon('circle-check') + ' Ready to save.' : icon('triangle-exclamation') + ' Not saveable yet.') + '</span>' +
            notes.map((x) => '<span>' + esc(x) + '</span>').join('');
          qsa('[data-be="use"],[data-be="save"]', s.el).forEach((b) => { b.disabled = !ok; });
          return ok;
        }
        function loadFen(text) {
          const p = fenParts(text);
          if (!Object.keys(p.pos).length && String(text).trim().split(/\s+/)[0].split('/').length !== 8) return false;
          st.pos = p.pos; st.turn = p.turn; st.castle = p.castle; st.ep = p.ep; st.move = p.move;
          qsa('[data-castle]', s.el).forEach((c) => { c.checked = st.castle.indexOf(c.getAttribute('data-castle')) >= 0; });
          qsa('[data-turn]', s.el).forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-turn') === st.turn)));
          qs('[data-ep]', s.el).value = st.ep; qs('[data-move]', s.el).value = st.move;

        }
        function saveAs() {

          const row = (n) => '<button type="button" data-new="' + esc(n) + '">' + icon('list') + '<span>' + esc(Site.LISTS[n][0]) + '<small>' + esc(Site.LISTS[n][1]) + '</small></span>' + icon('chevron-right') + '</button>';
          openSheet({
            title: 'Save as a new drill', noFocus: true,

            onMount(p) {

      exported: new Date().toISOString(), site: location.origin + location.pathname,

  function readBackup(text) {
    let data = null;
    try { data = JSON.parse(text); } catch (e) { return { error: 'That file is not valid JSON.' }; }
    if (!data || typeof data !== 'object' || Array.isArray(data)) return { error: 'That file is not a Lanckrietchess backup.' };
    const mine = data.app === BACKUP_APP;
    const doc = Site.cleanDoc(mine ? data.draft : data);
    if (!doc) return { error: 'That file is not a Lanckrietchess backup or a content.json.' };
    const raw = mine && data.keybook && typeof data.keybook === 'object' ? data.keybook : {}, book = {};
    Object.keys(raw).forEach((h) => { if (/^[0-9a-f]{64}$/.test(h) && /^LC-[A-Z0-9-]{4,60}$/.test(String(raw[h]))) book[h] = raw[h]; });
    const local = mine && data.local && typeof data.local === 'object' && !Array.isArray(data.local) ? data.local : {};
    const state = local.state && typeof local.state === 'object' ? local.state : null;
    return {
      doc, book, local,
      kind: mine ? (data.kind === 'database' ? 'a full database export' : 'an admin backup') : 'a published content.json',
      when: String(data.exported || data.updated || '').slice(0, 40),
      counts: {
        items: Object.keys(doc.lists || {}).reduce((a, n) => a + doc.lists[n].length, 0),
        texts: Object.keys(doc.copy || {}).length, keys: (doc.keys || []).length, book: Object.keys(book).length,
        reps: Array.isArray(local.repertoire) ? local.repertoire.length : 0,

  function mergeDoc(base, inc) {
    const out = clone(base);
    Object.keys(inc.copy || {}).forEach((k) => { out.copy[k] = inc.copy[k]; });
    Object.keys(inc.gates || {}).forEach((k) => { out.gates[k] = inc.gates[k]; });
    Object.keys(inc.bots || {}).forEach((k) => { out.bots[k] = inc.bots[k]; });
    Site.SETTINGS.forEach((x) => { const v = getPath(inc.settings || {}, x[0]); if (v !== undefined) setPath(out.settings, x[0], v); });
    Object.keys(inc.lists || {}).forEach((n) => { out.lists[n] = clone(inc.lists[n]); });
    if (Array.isArray(inc.folders) && inc.folders.length) out.folders = (out.folders || []).filter((f) => !inc.folders.some((g) => g && g.id === f.id)).concat(clone(inc.folders));
    const seen = {};
    (out.keys || []).forEach((k) => { seen[k.sha256] = 1; });
    (inc.keys || []).forEach((k) => { if (!seen[k.sha256]) { out.keys.push(k); seen[k.sha256] = 1; } });
    return Site.cleanDoc(out) || out;
  }
  function mergeState(cur, inc) {
    const num = (x) => +x || 0, out = clone(cur) || { v: 2 };
    out.profile = out.profile && out.profile.name ? out.profile : (inc.profile || out.profile);
    out.settings = Object.assign({}, inc.settings || {}, out.settings || {});
    out.progress = Object.assign({}, out.progress || {});
    Object.keys(inc.progress || {}).forEach((k) => {
      const a = out.progress[k], b = inc.progress[k] || {};
      out.progress[k] = a ? { best: Math.max(num(a.best), num(b.best)), runs: num(a.runs) + num(b.runs), last: Math.max(num(a.last), num(b.last)) } : b;
    });
    out.stats = Object.assign({}, out.stats || {});
    Object.keys(inc.stats || {}).forEach((k) => {
      const a = out.stats[k], b = inc.stats[k] || {};
      out.stats[k] = a ? { tries: num(a.tries) + num(b.tries), correct: num(a.correct) + num(b.correct), streak: Math.max(num(a.streak), num(b.streak)), best: Math.max(num(a.best), num(b.best)) } : b;
    });
    const d1 = out.daily || {}, d2 = inc.daily || {};
    out.daily = String(d2.last || '') > String(d1.last || '') ? d2 : d1;
    out.onboarded = !!(out.onboarded || inc.onboarded);
    return out;
  }
  function mergeReps(cur, inc) {
    const out = clone(cur) || [], by = {};
    out.forEach((r) => { by[r.id] = r; });
    (Array.isArray(inc) ? inc : []).forEach((r) => {
      if (!r || typeof r !== 'object' || !Array.isArray(r.lines)) return;
      const have = by[r.id];
      if (!have) { out.push(r); by[r.id] = r; return; }
      const seen = {};
      have.lines.forEach((l) => { seen[l.join(' ')] = 1; });
      r.lines.forEach((l) => { if (Array.isArray(l) && !seen[l.join(' ')]) { have.lines.push(l); seen[l.join(' ')] = 1; } });
    });
    return out;
  }
  /* how: 'merge' keeps this device and adds the file, 'replace' takes the file. The
     admin sign-in, the device id and the worker password are never part of it. */
  function applyBackup(b, how) {
    const keepAccess = (Store.get(KEYS.state, null) || {}).access || null;
    Admin.saveDraft(how === 'merge' ? mergeDoc(Admin.ensureDraft(), b.doc) : b.doc);
    Admin.saveKeybook(how === 'merge' ? Object.assign(Admin.keybook(), b.book) : b.book);
    const L = b.local || {};
    if (L.state && typeof L.state === 'object') {
      const next = how === 'merge' ? mergeState(Store.get(KEYS.state, null), L.state) : clone(L.state);
      if (keepAccess) next.access = keepAccess;
      Store.set(KEYS.state, next);
      App.load(); App.save();
    }
    if (Array.isArray(L.repertoire)) {
      Store.set(KEYS.rep, how === 'merge' ? mergeReps(Repertoire.list(), L.repertoire) : clone(L.repertoire));
      Repertoire.save(Repertoire.list());
    }
    if (L.avatar && typeof L.avatar === 'object') {
      const url = typeof L.avatar.url === 'string' && /^https:\/\/\S{4,2000}$/i.test(L.avatar.url) ? L.avatar.url : null;
      Store.set('lc-hub-avatar', { user: cleanName(L.avatar.user || ''), url, at: Date.now() });
    }
    V33.importLocal(L, how);
    Site.apply(); refreshChip(); rerender();
  }

      playedHTML(v.played) + (v.finished ? '' : '<div class="st-actions"><button type="button" class="btn btn-ghost btn-sm" data-act="line-hint">' + icon('lightbulb') + ' Hint</button><button type="button" class="btn btn-quiet btn-sm" data-act="line-show">Show move</button></div>');

    else {

      if (s && (s.type === 'tap' || s.type === 'move') && !done[at]) html += '<button type="button" class="btn btn-ghost btn-sm" data-act="hint">' + icon('lightbulb') + ' Hint</button>';
      if (!revealed && hasDebrief) html += '<button type="button" class="btn btn-quiet btn-sm" data-act="reveal">' + icon('eye') + ' Reveal Kyenzo’s analysis</button>';
    }
    part('actions').innerHTML = html;
  }
  function showDebrief(scroll) {
    const el = part('debrief'), okCount = results.filter((r) => r === true).length;
    if (!hasDebrief && !finished) return;
    el.hidden = false;
    el.innerHTML = (hasDebrief ? '<h3 class="debrief-title">' + icon('chess-king') + ' ' + esc(cfg.debriefTitle || 'Kyenzo’s analysis') + '</h3>' : '') +
      (finished ? '<p class="small muted" style="margin-top:4px">' + okCount + ' of ' + stages.length + (stages.length === 1 ? ' step' : ' steps') + ' right on the first try.</p>' : '') + debriefHTML(d.debrief);
    if (scroll && window.innerWidth < 960) { const r = el.getBoundingClientRect(); if (r.top > window.innerHeight - 140) window.scrollBy({ top: r.top - window.innerHeight * 0.4, behavior: 'smooth' }); }
  }
  function enter() {
    const s = stages[at];
    board.setTapMode(null); board.setInteractive(null); board.setOnMove(null); board.unmark('hl-good'); board.unmark('hl-bad');
    wrongTaps = 0; part('feedback').innerHTML = '';
    renderSteps(); renderStage(); renderActions();
    if (!s) return;

    if (s.type === 'move') { board.setInteractive(side); board.setOnMove(onStageMove); }
    if (s.type === 'line') {
      if (line) line.destroy();
      line = LineRunner({ board, fen: d.fen, pgn: s.pgn, ann: s.ann, side, section, lastMove, silent: isStatic(s) || isStatic(d), onUpdate: renderLine, onFinish: (r) => complete(r.total ? r.clean === r.total : true) });
      line.start();
    }
  }
  function complete(ok) {
    if (results[at] == null) results[at] = ok;
    done[at] = true;
    board.setTapMode(null);
    if (stages[at].type !== 'line') board.setInteractive(null);

  }
  function finish() {
    if (finished) return;
    finished = true;
    const acc = stages.length ? results.filter((r) => r === true).length / stages.length : 1, before = (App.progress[d.id] || {}).best || 0;
    App.finish(d.id, acc);
    stages.forEach((s, i) => { if (s.k) V33.stage(d.id, s.k, results[i] === true); });
    V33.afterFinish(d.id, acc, { kind: section || 'think', moves: Math.max(1, stages.length) }, before);
    Sound.done(); showDebrief(true); renderSteps(); renderActions();
  }
  function pickOption(i, btn) {
    const s = stages[at];
    if (!s || s.type !== 'mcq' || done[at]) return;
    const o = opts[at][i], first = results[at] == null;
    if (first) App.score(section, !!o.correct);
    if (o.correct) {
      btn.classList.add('is-right');
      qsa('.opt', host).forEach((x) => { x.disabled = true; });
      part('feedback').innerHTML = feedbackHTML({ v: 'good', label: first ? 'Correct' : 'That’s it', text: o.why });
      Sound.good(); complete(first ? true : results[at]);
    } else {
      btn.classList.add('is-wrong'); btn.disabled = true;
      part('feedback').innerHTML = feedbackHTML({ v: 'off', label: 'Not quite', text: o.why });
      Sound.bad();
      if (first) { results[at] = false; renderSteps(); }
    }
  }
  function onTap(sq) {
    const s = stages[at];
    if (!s || s.type !== 'tap' || done[at]) return;
    const ok = s.answer.indexOf(sq) >= 0, first = results[at] == null;
    if (first) App.score(section, ok);
    if (ok) {
      board.mark(sq, 'hl-good');
      part('feedback').innerHTML = feedbackHTML({ v: 'good', label: first ? 'Correct' : 'That’s it', text: s.explain });
      Sound.good(); complete(first ? true : results[at]);
      return;
    }

    wrongTaps++;
    board.mark(sq, 'hl-bad'); later(() => board.unmark('hl-bad'), 650);
    Sound.bad();
    part('feedback').innerHTML = feedbackHTML({ v: 'off', label: 'Not that square', text: wrongTaps >= 2 && s.hint ? s.hint : 'Look again and try another square.' });
  }
  function onStageMove(m) {
    const s = stages[at];
    if (!s || s.type !== 'move' || done[at]) return;
    const t = new Chess(d.fen), mv = t.move({ from: m.from, to: m.to, promotion: m.promotion || 'q' });
    if (!mv) { board.setPosition(d.fen, { lastMove }); return; }
    const first = results[at] == null;
    const acc = pickNote(s.accept, mv.san), alt = pickNote(s.alt, mv.san), bad = pickNote(s.bad, mv.san);
    board.setPosition(t.fen(), { lastMove: { from: mv.from, to: mv.to }, sound: mv.captured ? 'capture' : 'move' });
    if (acc || alt) {
      if (first) App.score(section, true);
      board.mark(mv.to, 'hl-good');
      part('feedback').innerHTML = feedbackHTML({ v: acc ? 'good' : 'alt', label: acc ? 'Correct' : 'Also good', san: mv.san, text: acc || alt });
      Sound.good(); complete(first ? true : results[at]);
      return;
    }
    if (first) { App.score(section, false); results[at] = false; renderSteps(); }
    board.mark(mv.to, 'hl-bad'); board.setInteractive(null); Sound.bad();
    part('feedback').innerHTML = feedbackHTML({ v: bad ? 'bad' : 'off', label: bad ? 'Not here' : 'Not the move', san: mv.san, text: bad || 'That is not the idea of this structure. Read the plan again and try another move.' });
    later(() => { board.unmark('hl-bad'); board.setPosition(d.fen, { lastMove }); board.setInteractive(side); }, 1600);
  }
  function hint() {
    const s = stages[at];
    if (!s || done[at]) return;
    if (results[at] == null) { App.score(section, false); results[at] = false; renderSteps(); }
    if (s.type === 'tap') part('feedback').innerHTML = feedbackHTML({ v: 'hint', label: 'Hint', text: s.hint || 'Look at the squares around the pieces that just moved.' });
    if (s.type === 'move') {
      const san = Object.keys(s.accept || {})[0], t = new Chess(d.fen), mv = san ? t.move(san, { sloppy: true }) : null;
      if (mv) board.mark(mv.from, 'hl-hint');

    }
  }
  function onClick(e) {
    const b = e.target.closest('button');
    if (!b || !host.contains(b)) return;
    if (b.hasAttribute('data-opt')) { pickOption(+b.getAttribute('data-opt'), b); return; }
    const act = b.getAttribute('data-act');
    if (act === 'advance') { at++; enter(); }
    else if (act === 'hint') hint();
    else if (act === 'reveal') { revealed = true; showDebrief(true); renderActions(); }
    else if (act === 'next' && cfg.onNext) cfg.onNext();

    else if (act === 'line-hint' && line) line.hint();
    else if (act === 'line-show' && line) line.showMove();
  }
  host.addEventListener('click', onClick);
  function start() {
    timers.forEach(clearTimeout); timers = [];
    if (line) { line.destroy(); line = null; }
    opts = stages.map((s) => (s.type === 'mcq' ? shuffle(s.options) : null));
    at = 0; results = stages.map(() => null); done = stages.map(() => false); revealed = false; finished = false; wrongTaps = 0;
    V33.begin(d.id, { kind: section || 'think', moves: Math.max(1, stages.length) });

    board.setPosition(d.fen, { animate: false, lastMove });

  }
  return {
    start,
    destroy() { timers.forEach(clearTimeout); if (line) line.destroy(); host.removeEventListener('click', onClick); board.setTapMode(null); board.setOnMove(null); board.setInteractive(null); }
  };
}

function EndgameRunner(cfg) {
  const drill = cfg.drill, board = cfg.board, section = cfg.section || 'endgame';
  const side = drill.side || sideOf(drill.fen), engineSide = side === 'w' ? 'b' : 'w', goal = drill.goal;
  let g, feedback, finished, timer = null, locked, survived, tries, clean, played;
  const hasPawn = (x) => x.fen().split(' ')[0].indexOf('P') >= 0;
  const after = (x, m) => { const t = new Chess(x.fen()); t.move(m); return t; };
  const probe = (x) => KPK.probe(kpkState(x));
  const legal = (x) => x.moves({ verbose: true }).filter((m) => !m.promotion || m.promotion === 'q' || m.promotion === 'r');
  const emit = () => { if (cfg.onUpdate) cfg.onUpdate(view()); };
  function view() {
    return {
      finished, feedback, played: played.slice(), survived, target: drill.survive || 0,
      yourTurn: !finished && !locked && g.turn() === side,
      prompt: finished ? 'Drill complete.' : g.turn() === side ? (goal === 'win' ? colorName(side) + ' to play and win.' : 'Find a move that holds the draw.') : 'Opponent is thinking…'
    };
  }
  function safePromotion(x, m) {
    if (m.promotion !== 'q' && m.promotion !== 'r') return false;
    const t = after(x, m);
    if (t.in_stalemate()) return false;
    return !t.moves({ verbose: true }).some((r) => r.to === m.to);
  }
  function describe(m, t) {
    const bits = [], st = kpkState(t);
    const wk = st.board.indexOf('K'), bk = st.board.indexOf('k'), pawn = st.board.indexOf('P');
    const opp = wk >= 0 && bk >= 0 ? KPK.opposition(wk, bk) : null;
    if (m.promotion) bits.push('Promotion, and the new queen is safe.');
    if (opp === 'direct' && m.piece === 'k') bits.push('Direct opposition: the kings face each other and the other side has to give way.');
    if (goal === 'win' && m.piece === 'k' && pawn >= 0 && KPK.keySquares(pawn).indexOf(sqIndex(m.to)) >= 0) bits.push('That is a key square: from here the pawn promotes whoever is to move.');
    if (goal === 'draw' && m.piece === 'k' && pawn >= 0 && !opp && KPK.insideSquare(sqIndex(m.to), pawn, false)) bits.push('Your king is inside the square of the pawn, so it can be caught without help.');
    if (!bits.length) bits.push(goal === 'win' ? 'Still winning.' : 'Still holding.');
    return bits.join(' ');
  }
  const winningMoves = (x) => legal(x).filter((m) => (m.promotion ? safePromotion(x, m) : probe(after(x, m)) === 'win'));
  const drawingMoves = (x) => legal(x).filter((m) => { const t = after(x, m); if (!hasPawn(t)) return true; if (m.promotion) return !safePromotion(x, m); return probe(t) === 'draw'; });
  function engineReply() {
    board.setInteractive(null); locked = true; emit();
    timer = setTimeout(() => {
      locked = false;
      const moves = legal(g);
      if (!moves.length) { finish(g.in_check() ? 'mate' : 'stalemate'); return; }
      let pick;
      if (engineSide === 'b') {
        const drawn = moves.filter((m) => probe(after(g, m)) === 'draw');
        const pool = drawn.length ? drawn : moves;
        pick = pool.slice().sort((a, b) => KPK.resistance(kpkState(after(g, b))) - KPK.resistance(kpkState(after(g, a))))[0];
      } else {
        pick = moves.map((m) => ({ m, score: m.promotion ? (safePromotion(g, m) ? -1 : 99) : drawingMoves(after(g, m)).length }))
          .sort((a, b) => a.score - b.score)[0].m;
      }
      const num = fullmove(g.fen()), mv = g.move(pick);
      played.push({ san: mv.san, color: mv.color, num, from: mv.from, to: mv.to, verdict: null });
      board.setPosition(g.fen(), { lastMove: { from: mv.from, to: mv.to }, sound: mv.captured ? 'capture' : 'move' });
      if (!hasPawn(g)) { finish('pawnless'); return; }
      board.setInteractive(side); emit();
    }, CONFIG.opponentDelay);
  }
  function finish(reason) {
    finished = true; locked = true; board.setInteractive(null);
    const acc = tries ? clean / tries : 1, before = (App.progress[drill.id] || {}).best || 0;
    App.finish(drill.id, acc);
    V33.afterFinish(drill.id, acc, { kind: section, moves: Math.max(1, tries) }, before);
    const texts = {
      promoted: 'Pawn promoted with the king in support. That is the technique.',
      pawnless: 'The pawn is gone. Bare kings, dead draw: exactly what you were asked to reach.',
      stalemate: 'Stalemate. For the defender that is a full half point saved.',
      mate: 'Checkmate.',
      survived: 'You held every move. With correct defence this position never becomes a loss.'
    };
    feedback = { v: 'done', label: 'Drill complete', text: texts[reason] || 'Drill complete.' };
    Sound.done(); emit();
    if (cfg.onFinish) cfg.onFinish({ accuracy: tries ? clean / tries : 1 });
  }
  function move(m) {
    if (locked || finished || g.turn() !== side) { board.setPosition(g.fen()); return; }
    const t = new Chess(g.fen()), num = fullmove(g.fen()), mv = t.move({ from: m.from, to: m.to, promotion: m.promotion || 'q' });
    if (!mv) { board.setPosition(g.fen()); return; }
    tries++;
    let good, text = '';
    if (mv.promotion) { good = goal === 'win' ? safePromotion(g, mv) : false; text = good ? 'Promotion, and the new queen is safe.' : 'The promotion fails: the queen falls or it is stalemate.'; }
    else if (!hasPawn(t)) { good = goal === 'draw'; text = 'The pawn is off the board.'; }
    else { good = probe(t) === goal; text = good ? describe(mv, t) : ''; }
    if (good) {
      clean++; survived++; App.score(section, true);
      played.push({ san: mv.san, color: mv.color, num, from: mv.from, to: mv.to, verdict: 'good' });
      g = t;
      board.setPosition(g.fen(), { lastMove: { from: mv.from, to: mv.to }, sound: mv.captured ? 'capture' : 'move' });
      feedback = { v: 'good', label: 'Correct', san: mv.san, text };
      Sound.good();
      if (mv.promotion) { finish('promoted'); return; }
      if (!hasPawn(g)) { finish('pawnless'); return; }
      if (drill.survive && survived >= drill.survive) { finish('survived'); return; }
      emit(); engineReply();
      return;
    }
    App.score(section, false); Sound.bad();
    V33.miss(drill.id, section, tries, mv.san);
    const better = goal === 'win' ? winningMoves(g) : drawingMoves(g);
    const names = better.slice(0, 2).map((x) => x.san).join(' or ');
    board.setPosition(t.fen(), { lastMove: { from: mv.from, to: mv.to } });
    board.mark(mv.to, 'hl-bad'); board.setInteractive(null); locked = true;
    feedback = {
      v: goal === 'win' ? 'miss' : 'bad', label: goal === 'win' ? 'Missed win' : 'Blunder', san: mv.san,
      text: (goal === 'win' ? 'This turns the win into a draw: with best play the defender holds from here.' : 'Now it is lost with best play.') + (names ? ' The move was ' + names + '.' : '') + (text ? ' ' + text : '')
    };
    emit();
    timer = setTimeout(() => { locked = false; board.unmark('hl-bad'); board.setPosition(g.fen(), { lastMove: played.length ? { from: played[played.length - 1].from, to: played[played.length - 1].to } : null }); board.setInteractive(side); emit(); }, 2000);
  }
  function start() {
    clearTimeout(timer);
    g = new Chess(drill.fen); feedback = null; finished = false; locked = false; survived = 0; tries = 0; clean = 0; played = [];
    V33.begin(drill.id, { kind: section, moves: drill.survive || 6 });
    KPK.build();
    board.setTapMode(null); board.setOnMove(move); board.clearMarks(); board.setArrows([]);
    board.orientation(side === 'w' ? 'white' : 'black');
    board.setPosition(drill.fen, { animate: false, lastMove: null });
    if (g.turn() === side) { board.setInteractive(side); emit(); } else engineReply();
  }
  return {
    start, restart: start, move,
    hint() {
      if (finished || locked || g.turn() !== side) return;
      const better = goal === 'win' ? winningMoves(g) : drawingMoves(g);
      if (!better.length) return;
      board.mark(better[0].from, 'hl-hint');
      feedback = { v: 'hint', label: 'Hint', text: drill.hint || 'The piece that has to move stands on ' + better[0].from + '.' };
      emit();
    },
    destroy() { clearTimeout(timer); locked = true; finished = true; }
  };
}

/* Opening tree for Explore mode: every line of a repertoire merged into one tree. */
function buildTree(lines) {
  const root = { san: null, fen: START_FEN, parent: null, kids: [], lines: [], notes: [], from: null, to: null, color: null, num: 0 };
  lines.forEach((line) => {
    const t = new Chess();
    let node = root;
    for (const san of line.moves) {
      const num = fullmove(t.fen()), mv = t.move(san, { sloppy: true });
      if (!mv) break;
      let kid = node.kids.filter((k) => k.san === mv.san)[0];
      if (!kid) { kid = { san: mv.san, fen: t.fen(), parent: node, kids: [], lines: [], notes: [], from: mv.from, to: mv.to, color: mv.color, num }; node.kids.push(kid); }
      if (kid.lines.indexOf(line) < 0) kid.lines.push(line);
      const note = pickNote(line.ann, moveLabel(num, mv.color, mv.san));
      if (note && note.note && kid.notes.indexOf(note.note) < 0) kid.notes.push(note.note);
      node = kid;
    }
  });
  return root;
}

    const moves = new Chess(before.fen).moves({ verbose: true });

    const n = moves.filter((m) => m.captured || /[+#]/.test(m.san)).length, opts = [n];

      brief: 'Your opponent just played ' + before.key + '. Run MSPC before you move.',
      stages: [
        { k: 'P', type: 'mcq', prompt: 'Priorities first: how many checks and captures do you have?', options: opts.map((v) => ({ text: v + (v === 1 ? ' forcing move' : ' forcing moves'), correct: v === n, why: (v === n ? 'Right. ' : 'Count again. ') + cca })) },
        { k: 'C', type: 'move', prompt: 'Now play your repertoire move.', accept, alt: note.alt || {}, bad: note.bad || {} }
      ],
      debrief: [
        { k: 'M', t: prev.note ? before.key + ': ' + prev.note : 'Your opponent’s last move was ' + before.key + '. Ask what it attacks and what it stopped defending.' },
        { k: 'P', t: n ? cca + ' Check whether one of them works before you choose a quiet move.' : 'No checks and no captures: this position is about the plan, not about tactics.' },

}

const Repertoire = {
  list() {

      .map((r) => ({ id: r.id.slice(0, 40), name: cleanName(r.name) || 'My repertoire', side: r.side, created: r.created || '',
        lines: r.lines.filter(Array.isArray).map((l) => l.filter((s) => typeof s === 'string' && s.length < 12).slice(0, 400)).filter((l) => l.length) }))
      .slice(0, 60);
  },
  save(list) { Store.set(KEYS.rep, list); },
  add(name, side, lines) {
    const list = this.list();

    if (!rep) { rep = { id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, side, created: dayKey(new Date()), lines: [] }; list.push(rep); }
    const have = {};
    rep.lines.forEach((l) => { have[l.join(' ')] = 1; });

    let total = list.reduce((n, r) => n + r.lines.length, 0), added = 0, dupes = 0, limited = 0;

      if (total >= cap) { limited++; return; }
      rep.lines.push(l.slice()); have[k] = 1; added++; total++;

    old.slice(0, 60).forEach((e) => {

};

    if (res.startFen !== START_FEN) { msg.textContent = 'Only lines from the normal starting position can be drilled. Remove the FEN header and try again.'; msg.className = 'form-msg is-bad'; return; }
    const r = Repertoire.add(form.elements.name.value, form.elements.side.value, res.lines);
    const bits = [];
    if (r.added) bits.push(r.added + (r.added === 1 ? ' line imported' : ' lines imported'));
    if (r.dupes) bits.push(r.dupes + ' already saved');
    if (r.limited) bits.push(r.limited + ' over the free limit');
    if (res.errors.length) bits.push('a line stopped early: ' + res.errors[0]);
    msg.textContent = bits.join(', ') + '.'; msg.className = 'form-msg ' + (r.added ? 'is-good' : 'is-bad');
    if (r.limited) openUnlock(gateLevel('customLines'), 'Unlimited custom lines');

/* ---------- the two coach bots: Free (Tier 1) and Pro (Tiers 2 and 3) ----------
   Two separate instances, each with its own instructions (Admin menu > AI
   assistants), its own conversation and its own limits. With a hub worker
   they answer through it and see the position, the moves, the legal moves and
   Stockfish's lines on every message; without one, or when it fails, the
   built-in coach answers. */
const COACH_BOTS = {
  free: { key: 'coachFree', name: 'Free coach', badge: 'Free' },
  paid: { key: 'coachPaid', name: 'Pro coach', badge: 'Pro' }
};
function CoachBot(kind) {
  const def = COACH_BOTS[kind];
  let history = [], used = 0, warned = false;
  const limit = () => (kind === 'free' ? Math.max(0, Math.floor(+CONFIG.coachBot.freeAiPerGame || 0)) : Infinity);
  const NOTE = {
    limit: 'The AI coach is taking a short break: too many questions this hour. The built-in coach answers for now.',
    tier: 'The Pro coach could not confirm your membership on the server. Paste your member key once more on the Upgrades page; the built-in coach answers for now.',
    offline: 'You are offline, so the built-in coach answers.'
  };
  return {
    kind, def, limit,
    instructions: () => botPrompt(def.key),
    left: () => (kind === 'free' ? Math.max(0, limit() - used) : null),
    reset() { history = []; used = 0; warned = false; },
    async reply(q, ctx) {
      if (AI.on() && used < limit()) {
        try {
          const board = await ctx.board();
          const turns = Math.max(1, +CONFIG.ai.history || 8) * 2;
          const r = await AI.chat(def.key, history.concat([{ role: 'user', content: q }]).slice(-turns), board);
          const text = AI.tags(r.text).clean || r.text;
          history.push({ role: 'user', content: q }, { role: 'assistant', content: text });
          history = history.slice(-40);
          used++;
          return { text, ai: true };
        } catch (e) {
          const out = await Coach.reply(q, ctx);
          if (NOTE[e.reason]) out.text = NOTE[e.reason] + '\n\n' + out.text;
          return out;
        }
      }
      const out = await Coach.reply(q, ctx);
      if (AI.on() && kind === 'free' && limit() > 0 && used >= limit() && !warned) {
        warned = true;
        out.text = 'That was the last of the ' + limit() + ' AI answers the free coach gives per game, so the built-in coach takes over. The Pro coach has no limit.\n\n' + out.text;
        out.actions = (out.actions || []).concat([{ label: 'See the Pro coach', href: '#upgrades' }]);
      }
      return out;
    }
  };
}

  function classify(evals) {

      const pov = m.color === 'w' ? 1 : -1;

      const best = evals[i].best, played = m.from + m.to + (m.promotion || '');
      let cls = best && played === best ? 'best' : loss >= 30 ? 'blunder' : loss >= 20 ? 'mistake' : loss >= 10 ? 'inaccuracy' : 'good';

      const reply = evals[i + 1].best;

  function categorize(it) {

    const pov = it.color === 'w' ? 1 : -1;
    const reply = it.reply ? new Chess(A.fens[it.i + 1]).move({ from: it.reply.slice(0, 2), to: it.reply.slice(2, 4), promotion: it.reply[4] || 'q' }) : null;
    if (it.threat && it.threat.best && it.reply && it.threat.best.slice(0, 4) === it.reply.slice(0, 4) &&

      const tSan = Engine.uciToSan(it.threat.fen, it.threat.best) || it.replySan;
      it.k = 'M'; it.text = 'Your opponent’s last move threatened ' + tSan + '. ' + it.san + ' did nothing about it, and ' + (it.replySan || tSan) + ' came anyway.';

  }

  /* Everything the AI coach sees with every message: the position, the moves,
     the legal moves and Stockfish's top lines (a quick search when the live
     analysis is not deep enough yet). */
  async function boardContext() {
    const c = context(), fen = c.fen, g = new Chess(fen), exploring = !!(A.explore && A.explore.moves.length);
    const sans = exploring ? A.moves.slice(0, A.explore.base).map((m) => m.san).concat(A.explore.moves.map((m) => m.san)) : A.moves.slice(0, A.idx).map((m) => m.san);
    let r = A.lastR && A.lastR.fen === fen && A.lastR.lines && A.lastR.lines.length ? A.lastR : null;
    if (!g.game_over() && (!r || (+r.lines[0].depth || 0) < 12)) {
      try { r = await Engine.analyse(fen, { depth: 14, multipv: 3 }); } catch (e) { /* the coach judges without the engine */ }
    }
    const legal = g.moves(), h = A.headers || {}, p = App.profile, it = c.item, base = exploring && A.explore.base > 0 ? A.moves[A.explore.base - 1] : null;
    return {
      fen, turn: colorName(sideOf(fen)), student: colorName(A.user),
      history: sans.length ? lineText(sans, A.start).slice(-1500) : 'No moves yet.',
      last: c.last ? moveLabel(c.last.num, c.last.color, c.last.san) : '',
      where: exploring ? 'The student is trying their own variation, which leaves the game ' + (base ? 'after ' + moveLabel(base.num, base.color, base.san) : 'at the start') + '.'
        : A.moves.length ? 'Game position after ' + A.idx + ' of ' + A.moves.length + ' half-moves.' : 'Analysis board, no game loaded.',
      over: g.game_over() ? (g.in_checkmate() ? 'checkmate' : 'draw') : '',
      legal: legal.slice(0, 90).join(' ') + (legal.length > 90 ? ' …' : ''),
      engine: r && r.lines && r.lines.length ? { depth: +r.lines[0].depth || 0, lines: r.lines.slice(0, 3).map((x) => ({ eval: Engine.fmt(x), pv: Engine.pvText(fen, x.pv, 10) })) } : null,
      review: it ? { move: moveLabel(it.num, it.color, it.san), verdict: it.cls, mspc: it.k ? it.k + ', ' + MSPC_NAME[it.k] : '', note: it.text || '', better: it.bestSan || '' } : null,
      game: A.moves.length ? { white: String(h.White || '').slice(0, 40), black: String(h.Black || '').slice(0, 40), whiteElo: String(h.WhiteElo || '').slice(0, 6), blackElo: String(h.BlackElo || '').slice(0, 6), result: String(h.Result || '').slice(0, 8), opening: String(h.Opening || h.ECO || '').slice(0, 60) } : null,
      player: V33.playerContext()
    };
  }
  function quota() {
    const el = qs('#coach-quota', view);
    if (!el) return;
    const b = bots[App.can('coachPaid') ? 'paid' : 'free'];
    el.textContent = !AI.on() ? '' : b.kind === 'paid' ? 'Unlimited AI answers.' : b.limit() ? b.left() + ' of ' + b.limit() + ' AI answers left in this game.' : '';
  }
  let asking = false;
  async function ask(q) {
    q = String(q || '').replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, 400);
    if (!q || asking) return;
    asking = true;
    V33.question(q);
    bubble(q, 'me');
    const t = document.createElement('div');
    t.className = 'msg msg-bot typing'; t.innerHTML = '<i></i><i></i><i></i>';
    chat.appendChild(t); chat.scrollTop = chat.scrollHeight;
    let reply;
    const bot = bots[App.can('coachPaid') ? 'paid' : 'free'];
    try { reply = await bot.reply(q, Object.assign(context(), { board: boardContext })); } catch (e) { reply = { text: 'Something went wrong on my side. Try again.' }; }
    await sleep(250);
    t.remove(); asking = false;
    bubble(reply.text, 'bot', reply.actions, reply.ai);
    if (reply.line) coachShow(reply.line.base, reply.line.moves, reply.line.label);
    quota();
    if (!A.reviewing) live();
  }
  function openGpt() {
    const url = App.can('coachPaid') ? (CONFIG.coachBot.gptPro || CONFIG.coachBot.gptFree) : CONFIG.coachBot.gptFree;
    if (url) window.open(url, '_blank', 'noopener');
    const extra = 'Current game: ' + (A.moves.length ? lineText(A.moves.map((m) => m.san), A.start) : 'none') + '\nPosition (FEN): ' + cur();
    copyText(coachBriefing(extra)).then((ok) => toast(url ? (ok ? 'Briefing copied. Paste it as your first message to the coach.' : 'Opening the coach…') : (ok ? 'Briefing copied. The coach bot link is not set up yet.' : 'The coach bot link is not set up yet.')));
  }

  /* v3.3: what the Game Vault, the interrogation and the V33 hooks see of this page */
  const T = {
    A, view, board, cboard, bots, cur, show, renderReport, renderSide, runReview, loadGame, coachShow, boardContext, quota,
    bubble: (text, who, actions) => bubble(text, who, actions),
    curLast: () => (A.explore && A.explore.moves.length ? A.explore.moves[A.explore.moves.length - 1] : A.moves[A.idx - 1] || null)
  };
  iq = TrimInterrogation(T);
  T.iq = iq;

  function onClick(e) {
    const a = e.target.closest('[data-act],[data-i],[data-side],[data-q],[data-c],[data-pv],[data-lines]');
    if (!a || !view.contains(a)) return;
    if (a.hasAttribute('data-pv')) { showPv(+a.getAttribute('data-pv')); return; }
    if (a.hasAttribute('data-lines')) { setLines(+a.getAttribute('data-lines')); return; }
    if (a.hasAttribute('data-q')) { ask(a.getAttribute('data-q')); return; }
    if (a.hasAttribute('data-c')) {
      const c = a.getAttribute('data-c');
      if (c === 'back' && CL.at > 0) { CL.at--; cbPaint(); }
      else if (c === 'fwd' && CL.at < CL.moves.length) { CL.at++; cbPaint(); }
      else if (c === 'sync') { CL.moves = []; CL.at = 0; qs('#coach-line', view).textContent = 'Showing the position from the main board.'; cboard.setPosition(cur(), { animate: false, lastMove: curLast() }); }
      else if (c === 'gpt') openGpt();
      return;
    }
    if (a.hasAttribute('data-side')) { A.user = a.getAttribute('data-side'); renderSide(); renderReport(); return; }
    if (a.hasAttribute('data-i') && a.closest('#an-moves')) { go(+a.getAttribute('data-i')); return; }
    const act = a.getAttribute('data-act');
    if (act === 'load') loadGame(qs('#an-pgn', view).value);
    else if (act === 'paste') {
      if (navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then((t) => { qs('#an-pgn', view).value = String(t).slice(0, 200000); if (t) loadGame(t); }, () => toast('Clipboard access was blocked. Paste it into the box instead.'));
      else toast('Clipboard access is not available here. Paste it into the box instead.');
    }
    else if (act === 'sample') { qs('#an-pgn', view).value = SAMPLE_PGN; loadGame(SAMPLE_PGN); }
    else if (act === 'first') go(0);
    else if (act === 'prev') { if (A.explore) undo(); else go(A.idx - 1); }
    else if (act === 'next') { if (!A.explore) go(A.idx + 1); }
    else if (act === 'last') go(A.moves.length);
    else if (act === 'flip') { board.flip(); cboard.flip(); evalbar.classList.toggle('is-flipped', board.orientation() === 'black'); if (A.lastR) paintEval(A.lastR); }
    else if (act === 'undo') undo();
    else if (act === 'engine') { A.engineOn = !A.engineOn; a.setAttribute('aria-pressed', String(A.engineOn)); if (!A.engineOn) Engine.stop(); live(); }
    else if (act === 'review') runReview();
    else if (act === 'deeper') { A.depth = Math.min(40, A.depth + (CONFIG.engine.deeperStep || 6)); toast('Searching to depth ' + A.depth + '.'); live(); }
    else if (act === 'exit-var') { A.explore = null; show(); }
    else if (act === 'goto') focusMoment(+a.getAttribute('data-i'));
    else if (act === 'export') { const pgn = annotatedPgn(); download('trim-review.pgn', pgn, 'application/x-chess-pgn'); copyText(pgn); toast('Annotated PGN downloaded and copied.', 'good'); }
    else if (act === 'ask-leaks') { ask('My leaks'); scrollToEl(qs('#coach', view)); }
    else if (act === 'unlock-report') openUnlock(gateLevel('trimReport'), 'The full Trim report');
    else if (act === 'interrogate') iq.start();
    else if (act === 'vault-save') saveGame(T, true);
    else if (act === 'save-pos') savePosition(T);
  }
  function onKey(e) {
    const t = e.target;
    if ((t && t.closest && t.closest('input, textarea, select')) || qs('.sheet-wrap')) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (A.explore) undo(); else go(A.idx - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); if (!A.explore) go(A.idx + 1); }
  }
  view.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);
  qs('#coach-form', view).addEventListener('submit', (e) => { e.preventDefault(); const inp = e.target.elements.q; ask(inp.value); inp.value = ''; });
  V33.greet(T);
  renderMoves(); renderSide(); show(false); quota();
  V33.trimLoad(T);
  return () => {
    A.cancel = true; A.token++; Engine.stop();
    document.removeEventListener('keydown', onKey); view.removeEventListener('click', onClick);
    iq.destroy(); board.destroy(); cboard.destroy();
  };
}

/* The Upgrades gateway: "Talk to Kyenzo's assistant", the Private Jet and Bridge

   With a hub worker (CONFIG.ai.endpoint) the player can also type anything: the
   sales assistant answers with the instructions from admin mode, sees the
   answers so far and turns [[PATH:...]] tags into the right buttons. Without
   the worker, or when it fails, the scripted assistant answers. */
function SalesBot(host) {
  const chat = qs('.chat', host), quick = qs('.quick', host), form = qs('form', host), P = CONFIG.pricing, coach = CONFIG.coach;
  let A = {}, step = null, busy = false, timers = [], history = [], alive = true, lastRoute = '';
  const FLOW = {
    start: { say: () => ['Hey' + (App.profile.name ? ' ' + App.profile.name : '') + '! I’m ' + coach + '’s assistant.', 'A few quick questions and I’ll show you the fastest route to your next rating jump' + (AI.on() ? ', or just type your own question' : '') + '. First: what’s your rating right now?'], opts: [['u800', 'Under 800'], ['800', '800–1200'], ['1200', '1200–1600'], ['1600', '1600+']], key: 'rating', next: 'leak' },
    leak: { say: () => ['Got it. Be honest with me: what costs you the most games?'], opts: Object.keys(LEAKS).map((k) => [k, LEAKS[k]]), key: 'leak', next: 'stuck' },
    stuck: { say: () => ['How long have you been stuck around this rating?'], opts: [['m1', 'Less than a month'], ['m6', '1–6 months'], ['m6p', 'More than 6 months'], ['years', 'Years']], key: 'stuck', next: 'goal' },
    goal: { say: () => ['Where do you want to be six months from now?'], opts: [['p200', '+200'], ['p400', '+400'], ['p600', '+600 or more'], ['stop', 'I just want to stop blundering']], key: 'goal', next: 'time' },
    time: { say: () => ['How much time can you realistically train per week?'], opts: [['t2', 'Under 2 hours'], ['t5', '2–5 hours'], ['t10', '5–10 hours'], ['t10p', 'More than 10 hours']], key: 'time', next: 'intent' },
    intent: { say: () => [painLine(), 'Last question: how do you want to get there?'], opts: [['walk', 'Start free'], ['bridge', 'Show me the full system'], ['jet', 'I want 1-on-1 with ' + coach]], key: 'intent', next: (v) => (v === 'jet' ? 'budget' : 'result') },
    budget: { say: () => ['The mentorship is ' + P.mentorship.price + P.mentorship.per + ' and capped at ' + P.mentorship.cap + ' players, because ' + coach + ' goes through every game himself. Is that realistic for you right now?'], opts: [['yes', 'Yes, let’s talk'], ['no', 'Not right now']], key: 'budget', next: 'result' }
  };
  const scroll = () => { chat.scrollTop = chat.scrollHeight; };
  function painLine() {
    const leak = { threats: 'Losing games to threats you didn’t see', opening: 'Being lost straight out of the opening', plan: 'Reaching good positions without a plan', endgame: 'Throwing away won endgames', time: 'Panicking on the clock' }[A.leak] || 'Losing the same way over and over';

  }
  function addMsg(text, who) {

  function addLinks(list) {

    el.innerHTML = '<div class="msg-actions" style="margin-top:0">' + list.map((l) => '<a class="btn btn-ghost btn-sm" href="' + esc(l[1]) + '"' + (/^https?:/.test(l[1]) ? ' target="_blank" rel="noopener"' : '') + '>' + esc(l[0]) + '</a>').join('') + '</div>';

  }
  function typing() {

    chat.appendChild(t); scroll();
    return t;
  }
  function botSay(lines, then) {
    busy = true; quick.innerHTML = '';
    let i = 0;
    (function nextLine() {

      if (i >= lines.length) { busy = false; if (then) then(); return; }
      const t = typing();
      timers.push(setTimeout(() => { t.remove(); addMsg(lines[i++], 'bot'); nextLine(); }, 450 + Math.min(900, lines[i].length * 8)));
    })();
  }
  const optionsHTML = (s) => s.opts.map((o) => '<button type="button" data-v="' + esc(o[0]) + '">' + esc(o[1]) + '</button>').join('');
  function resume() { if (alive) quick.innerHTML = step ? optionsHTML(FLOW[step]) : '<button type="button" data-v="restart">Start over</button>'; }
  function ask(name) { step = name; botSay(FLOW[name].say(), resume); }
  function answer(value, label) {

  /* The three routes, drawn from CONFIG so links and prices stay in one place. */
  function recs() {

      jet: { title: 'Your path: the Private Jet, 1-on-1 Mentorship', text: P.mentorship.price + P.mentorship.per + ', maximum ' + P.mentorship.cap + ' players at a time' + (P.mentorship.seatsLeft != null ? ', ' + P.mentorship.seatsLeft + (P.mentorship.seatsLeft === 1 ? ' seat' : ' seats') + ' open right now' : '') + '.', ctas: [['Apply for a seat', CONFIG.links.mentorship, 'gold'], ['See the Accelerator instead', CONFIG.links.accelerator, 'ghost']] }
    };
  }
  function showRec(route) {

    const el = document.createElement('div');
    el.className = 'rec';
    el.innerHTML = '<h4>' + esc(R.title) + '</h4><p class="small" style="color:#cbd5e1">' + esc(R.text) + '</p><div class="btn-row">' + R.ctas.filter((c) => c[1]).map((c) =>
      '<a class="btn btn-' + c[2] + ' btn-sm" href="' + esc(c[1]) + '"' + (/^https?:/.test(c[1]) ? ' target="_blank" rel="noopener"' : '') + '>' + esc(c[0]) + '</a>').join('') + '</div>';
    chat.appendChild(el); scroll();
  }
  function result() {
    step = null;
    const route = A.intent === 'walk' ? 'walk' : A.intent === 'jet' && A.budget === 'yes' ? 'jet' : 'bridge';
    if (!App.profile.leak && LEAKS[A.leak]) { App.profile.leak = A.leak; App.save(); }
    const lines = {
      walk: ['Then start with the free community. You get the Blunder Bootcamp, the Anti-Blunder Bootcamp, the free MSPC course and the community key that unlocks those lessons in this app.'],
      bridge: ['Based on your answers, the Accelerator fits you best: the full system at your own speed, for ' + P.accelerator.price + P.accelerator.per + '.', focusLine()],
      jet: ['Perfect. Apply below and ' + coach + ' reads your application himself.']
    }[route];

  }
  /* What the AI assistant sees with every message. */
  function context() {
    const answers = {};
    Object.keys(FLOW).forEach((k) => { const s = FLOW[k], v = A[s.key], o = v && s.opts.filter((x) => x[0] === v)[0]; if (o) answers[s.key] = o[1]; });
    const s = step ? FLOW[step] : null, said = s ? s.say() : [];
    return {
      answers,
      pending_question: s ? said[said.length - 1] + ' (buttons: ' + s.opts.map((o) => o[1]).join(' / ') + ')' : '',
      prices: { accelerator: P.accelerator.price + P.accelerator.per, mentorship: P.mentorship.price + P.mentorship.per, mentorship_seats_total: P.mentorship.cap, mentorship_seats_open: P.mentorship.seatsLeft == null ? 'not published' : P.mentorship.seatsLeft },
      player: { name: App.profile.name || '', rating: App.profile.elo || null, leak: LEAKS[App.profile.leak] || '', goal: GOALS[App.profile.goal] || '', access: TIERS[App.access.tier].label },
      recommended: lastRoute
    };
  }
  async function aiReply(text) {
    busy = true; quick.innerHTML = '';
    const t = typing();
    history.push({ role: 'user', content: text });
    let r = null, err = null;
    try { r = await AI.chat('sales', history.slice(-12), context()); } catch (e) { err = e; }
    if (!alive) return;
    t.remove(); busy = false;
    if (!r) { history.pop(); fallback(text, err && err.reason === 'limit' ? 'I’m getting a lot of questions right now, so here is the short answer. ' : ''); return; }
    const tg = AI.tags(r.text);
    history.push({ role: 'assistant', content: tg.clean || r.text });
    history = history.slice(-24);
    if (tg.clean) addMsg(tg.clean, 'bot');
    tg.found.forEach((f) => {
      if (f[0] !== 'PATH') return;
      if (f[1] === 'dm') addLinks([['Message ' + coach + ' on Instagram', CONFIG.links.instagramDM]]);
      else showRec(f[1] === 'car' ? 'bridge' : f[1]);
    });
    resume();
  }
  /* The scripted answers: offline, without a hub worker, or when it fails. */
  function fallback(text, prefix) {
    const t = text.toLowerCase(), say = (lines, then) => botSay(prefix ? [prefix + lines[0]].concat(lines.slice(1)) : lines, then);
    const dm = () => { addLinks([['Message ' + coach + ' on Instagram', CONFIG.links.instagramDM]]); resume(); };
    if (/(price|cost|how much|€|\$|euro|dollar|pay|prijs|kost)/.test(t)) say(['Free community: €0. The Accelerator: ' + P.accelerator.price + P.accelerator.per + '. 1-on-1 Mentorship: ' + P.mentorship.price + P.mentorship.per + ', maximum ' + P.mentorship.cap + ' players.'], resume);
    else if (/(1.?on.?1|one on one|private|mentor|personal|coach me|coaching|jet)/.test(t)) {
      A.intent = 'jet';
      if (A.rating) ask('budget'); else say(['1-on-1 with ' + coach + ' is the Mentorship. A few questions first, so he knows where you stand.'], resume);
    }
    else if (/(human|real person|talk to you|\bdm\b)/.test(t) || t.indexOf(String(coach).toLowerCase()) >= 0) say([coach + ' answers his DMs himself.'], dm);
    else if (/(free|skool|community|bootcamp|gratis)/.test(t)) say(['The free community is the best place to start: the bootcamps are free and you get the community key for this app.'], () => { addLinks([['Join free on Skool', CONFIG.links.skool]]); resume(); });
    else say([AI.on() ? 'I couldn’t reach the assistant just now. Tap one of the answers below, or message ' + coach + ' directly.' : 'I’m a simple assistant, so tap one of the answers below, or message ' + coach + ' directly.'], dm);
  }
  function matchOption(s, text) {
    const t = text.toLowerCase();
    const exact = s.opts.filter((o) => o[1].toLowerCase() === t)[0];
    if (exact) return exact;
    if (s.key === 'rating' && /^\D{0,12}\d{3,4}\D{0,12}$/.test(t)) { const n = parseInt(t.replace(/[^\d]/g, ''), 10); if (n) return s.opts[n < 800 ? 0 : n < 1200 ? 1 : n < 1600 ? 2 : 3]; }
    if (s.key === 'leak') {
      const hit = [['threats', /blunder|threat|hang|tactic/], ['opening', /opening/], ['plan', /plan|middle/], ['endgame', /endgame|convert|ending/], ['time', /time|clock|panic/]].filter((m) => m[1].test(t))[0];
      if (hit) return s.opts.filter((o) => o[0] === hit[0])[0];
    }
    if (s.key === 'budget') { if (/^(yes|ja|yeah|sure|ok)/.test(t)) return s.opts[0]; if (/^(no|nee|not)/.test(t)) return s.opts[1]; }
    return null;
  }
  function onQuick(e) {
    const b = e.target.closest('[data-v]');
    if (!b || busy) return;
    const v = b.getAttribute('data-v');
    if (v === 'restart') { reset(); return; }
    answer(v, b.textContent);
  }
  function onSubmit(e) {
    e.preventDefault();
    const inp = form.elements.msg, text = String(inp.value || '').replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, 280);
    if (!text || busy) return;
    inp.value = '';
    const opt = step ? matchOption(FLOW[step], text) : null;
    if (opt) { answer(opt[0], text); return; }
    addMsg(text, 'me');
    if (AI.on()) aiReply(text); else fallback(text, '');
  }
  function reset() { timers.forEach(clearTimeout); timers = []; busy = false; A = {}; history = []; lastRoute = ''; chat.innerHTML = ''; ask('start'); }
  quick.addEventListener('click', onQuick);
  form.addEventListener('submit', onSubmit);
  ask('start');
  return { destroy() { alive = false; timers.forEach(clearTimeout); quick.removeEventListener('click', onQuick); form.removeEventListener('submit', onSubmit); } };
}

/* ---------- ABOUT: the founder, the fast track and the ELO chapters ----------
   Chapters come from CONTENT.story (Admin menu > About: ELO chapters): a date,
   the rating at that moment (elo, optional) and the story. The rating chart,
   the fast-track meter and the chapter badges are all drawn from them. */
const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
function shortDate(s) {
  s = String(s || '').trim();
  const m = s.match(/^(?:\d{1,2}\s+)?([A-Za-z]+)\s+(\d{4})$/);
  if (m && MONTHS.indexOf(m[1].toLowerCase()) >= 0) return m[1].charAt(0).toUpperCase() + m[1].slice(1, 3).toLowerCase() + ' ' + m[2];
  return s.length > 12 ? s.slice(0, 11) + '…' : s;
}
function storyChapters() {
  let prev = null;
  return (CONTENT.story || []).filter((c) => c && typeof c === 'object').map((c) => {
    const eloText = tok(c.elo == null ? '' : String(c.elo)).trim(), n = parseInt(eloText.replace(/[^\d]/g, ''), 10);
    const elo = Number.isFinite(n) && n > 0 && n < 4000 ? n : null;
    const out = { date: tok(c.date || c.label || ''), title: tok(c.title || ''), text: tok(c.text || ''), elo, from: elo != null ? prev : null };
    if (elo != null) prev = elo;
    return out;
  });
}
function ratingChart(chapters) {
  let pts = chapters.filter((c) => c.elo != null).map((c) => [shortDate(c.date), c.elo]);
  if (pts.length < 2) pts = [['Start', +CONFIG.startRating || 0], ['Peak', +CONFIG.peakRating || 0]];
  const hi = Math.max.apply(null, pts.map((p) => p[1])), top = Math.max(2200, Math.ceil((hi + 150) / 500) * 500);
  const W = 640, Hh = 270, L = 46, R = 26, Tp = 30, B = 40, dense = pts.length > 6;
  const x = (i) => L + i * (W - L - R) / (pts.length - 1), y = (v) => Tp + (1 - v / top) * (Hh - Tp - B);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
  let s = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + esc('Rating from ' + pts[0][1] + ' to a peak of ' + hi) + '">' +
    '<defs><linearGradient id="rgFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".32"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs>';
  for (let v = 0; v <= top; v += 500) {
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="rgba(148,163,184,.13)"/><text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#64748b">' + v + '</text>';
  }
  s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(1500) + '" y2="' + y(1500) + '" stroke="#fbbf24" stroke-dasharray="5 5" stroke-opacity=".85"/>' +
    '<text x="' + (L + 8) + '" y="' + (y(1500) - 8) + '" font-size="12" fill="#fbbf24">1500: the goal my friends laughed at</text>' +
    '<path d="' + line + ' L' + x(pts.length - 1) + ' ' + (Hh - B) + ' L' + x(0) + ' ' + (Hh - B) + ' Z" fill="url(#rgFill)"/>' +
    '<path d="' + line + '" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p, i) => {
    const last = i === pts.length - 1, peak = p[1] === hi;
    s += '<circle cx="' + x(i) + '" cy="' + y(p[1]) + '" r="' + (peak ? 6 : 5) + '" fill="#0f172a" stroke="' + (peak ? '#fbbf24' : '#38bdf8') + '" stroke-width="3"/>' +
      '<text x="' + x(i) + '" y="' + (y(p[1]) - 13) + '" text-anchor="' + (last ? 'end' : 'middle') + '" font-size="15" font-weight="800" fill="' + (peak ? '#fbbf24' : '#e2e8f0') + '">' + p[1] + '</text>' +
      (dense && i % 2 && !last ? '' : '<text x="' + x(i) + '" y="' + (Hh - 12) + '" text-anchor="' + (i === 0 ? 'start' : last ? 'end' : 'middle') + '" font-size="12" fill="#94a3b8">' + esc(p[0]) + '</text>');
  });
  return s + '</svg>';
}
/* Avatar: your own image first (an upload or a URL), then Chess.com's public
   API (no key needed), then your initials. */
function chesscomAvatar(user, fresh) {
  user = String(user || '').trim().toLowerCase();
  if (!/^[a-z0-9_-]{2,40}$/.test(user)) return Promise.resolve(null);
  const c = Store.get('lc-hub-avatar', null);
  if (!fresh && c && c.user === user && Date.now() - c.at < 7 * 864e5) return Promise.resolve(c.url || null);
  return fetchWithTimeout('https://api.chess.com/pub/player/' + encodeURIComponent(user), {}, 6000)
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => { const url = d && /^https:\/\//.test(d.avatar || '') ? d.avatar : null; Store.set('lc-hub-avatar', { user, url, at: Date.now() }); return url; })
    .catch(() => null);
}
function loadAvatar(host) {
  if (!host) return;
  const A = CONFIG.about || {};
  const put = (url) => {
    if (!/^(https:\/\/|data:image\/)/.test(url || '')) return;
    const img = new Image();
    img.alt = ''; img.referrerPolicy = 'no-referrer'; img.decoding = 'async';
    img.onload = () => { host.innerHTML = ''; host.appendChild(img); host.classList.add('has-img'); };
    img.src = url;
  };
  if (A.avatarUrl) { put(A.avatarUrl); return; }
  chesscomAvatar(A.chesscomUsername).then((u) => { if (u) put(u); });
}
function resizeImage(file, size) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas'), s = Math.min(img.naturalWidth, img.naturalHeight);
        c.width = size; c.height = size;
        c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.86));
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

/* ---------- shared with hub-worker.js: keep both copies identical ----------
   lcPeriod: leaderboard periods in UTC, so the hub and the worker agree.
   lcScore: the anti-cheat ranking. Only the first attempt at each puzzle in a
   period counts (repeats train you, they don't rank you), hints and shown
   moves already count as misses, attempts faster than a human can move are
   ignored, and accuracy is pulled towards 50% until a player has solved
   enough puzzles (a Bayesian average), so one easy puzzle at 100% can never

    const drill = () => { const key = b + '|' + k; if (!A.drills[key]) A.drills[key] = { b, k, g: String(r.g || ''), s: 0, f: 0, acc: 0, m: 0 }; return key; };

/* ---------- Hyper-Focus: one MSPC habit the coach holds you to ---------- */

/* ---------- attempts: one row per finished puzzle, for the leaderboard ---------- */
function levelMid(level) {

    if (l.id === bare || bare.indexOf(l.id + '-') === 0 || (l.steps || []).some((st) => st && st.id === bare)) { lv = l.level || '0–800'; return true; }

  }

    if (!list) { const raw = Store.get(KEY, []); list = (Array.isArray(raw) ? raw : []).map(norm).filter(Boolean).sort((a, b) => a.t - b.t).slice(-MAX); }

  }

/* ---------- the leaderboard client ----------
   Your own score is computed on this device from your attempts. The community
   board lives on the hub worker (D1 database): it stores your attempts, scores
   them with the same lcScore and ranks everyone who joined. */
const Ranks = (() => {
  const SYNC = 'lc-hub-lb-sync', SIG = 'lc-hub-lb-sig';
  let timer = null, busy = false, cache = {};
  const endpoint = () => String((CONFIG.community && CONFIG.community.endpoint) || (CONFIG.ai && CONFIG.ai.endpoint) || '').trim();
  const on = () => /^https:\/\/\S+$/i.test(endpoint()) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/\S*)?$/i.test(endpoint());

    const w = getPath(CONFIG, 'leaderboard.weights') || {}, v = (x, d) => (x !== null && x !== '' && Number.isFinite(+x) && +x >= 0 ? +x : d);

  }
  function mine(p) { const r = lcPeriod(p); return Object.assign(lcScore(Attempts.all(), { from: r.from, to: r.to, min: min(), w: weights() }), { period: r }); }
  const joined = () => !!App.settings.board && !!App.profile.name && App.can('leaderboard');
  async function post(body) {
    let res, data = null;
    try {
      res = await fetchWithTimeout(endpoint(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ app: 'lanckrietchess-hub', version: CONFIG.version }, body)) }, (CONFIG.community && CONFIG.community.timeoutMs) || 8000);
      data = await res.json();
    } catch (e) { throw Object.assign(new Error('network'), { reason: 'network' }); }
    if (!data || data.ok !== true) throw Object.assign(new Error('lb'), { reason: (data && typeof data.reason === 'string' && data.reason.slice(0, 30)) || 'server' });
    return data;
  }
  async function sync() {
    if (!on() || !joined() || busy || navigator.onLine === false) return false;
    const b = bracketOf(App.profile.elo), sig = App.profile.name + '|' + (b ? b.id : '');
    let last = +Store.get(SYNC, 0) || 0;
    if (!Attempts.since(last).length && Store.get(SIG, '') === sig) return true;
    busy = true;
    try {
      for (let round = 0; round < 5; round++) {
        const batch = Attempts.since(last).slice(0, 150);
        await post({ action: 'lb_sync', device: deviceId(), name: App.profile.name, bracket: b ? b.id : '', attempts: batch });
        if (batch.length) { last = batch[batch.length - 1].t; Store.set(SYNC, last); }
        if (batch.length < 150) break;

      Store.set(SIG, sig); cache = {};

    } catch (e) { return false; } finally { busy = false; }
  }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(() => { sync(); }, ms == null ? 4000 : ms); }
